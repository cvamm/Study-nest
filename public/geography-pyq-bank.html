rks Gully Erosion):\n\u2022 Sheet Erosion:\n  - Process: Occurs on gentle, bare slopes where surface runoff strips away a relatively uniform thin layer of fertile topsoil, often going unnoticed initially.\n\u2022 Gully Erosion:\n  - Process: Fast-moving surface runoff cuts deep, vertical drainage rills that widen into gullies and ravines, carving the land into unproductive badland topography (as in the Chambal basin)."}, {"id": 39, "type": "SA", "tag": "CBSE 2018", "question": "What is 'Noise Pollution'? State two major physiological or psychological health effects of prolonged noise exposure. [3 Marks]", "answer": "Unwanted, disturbing high-decibel sound; Health effects: 1. Auditory damage/hearing loss; 2. Hypertension, sleep disturbance, and psychological stress.", "explanation": "Marking Scheme (1 Mark definition + 2 Marks health effects):\n\u2022 Definition: Sustained exposure to unwanted, disruptive, or excessive sound levels that cause discomfort or health risks to humans and wildlife.\n\u2022 Health Effects:\n  1. Auditory Damage: Chronic exposure to industrial or traffic noise exceeding 85 dB causes permanent hearing impairment and tinnitus.\n  2. Physiological & Mental Stress: Triggers elevated blood pressure, cardiovascular strain, sleep disturbance, and increased anxiety."}, {"id": 40, "type": "SA", "tag": "CBSE 2017", "question": "Describe the informal economy of 'Dharavi' slum in Mumbai. [3 Marks]", "answer": "Vibrant micro-enterprise hub; Leather tanning, Kumbharwada pottery, textile garment making, plastic recycling; High annual commercial turnover.", "explanation": "Marking Scheme (1 Mark for each dimension):\n\u2022 1. Informal Enterprises: Operates as a dense manufacturing hub with thousands of micro-workshops producing leather goods, pottery, garments, and baked foods.\n\u2022 2. Scrap Recycling Center: Recycles substantial volumes of Mumbai's discarded plastic, scrap metal, paper, and glass, converting urban waste into reusable raw material.\n\u2022 3. Economic Productivity: Despite substandard living conditions, Dharavi's decentralized enterprises generate an estimated annual turnover exceeding one billion dollars."}, {"id": 41, "type": "LA", "tag": "CBSE 2024", "question": "Examine 'Water Pollution' in India with particular reference to the Ganga and Yamuna river systems. Detail the point and non-point sources of pollutants, critical polluted river stretches, ecological impacts, and the institutional interventions undertaken under the Namami Gange Mission. [5 Marks]", "answer": "Comprehensive examination: Causes of river pollution (Domestic sewage, industrial chemical effluents, agricultural fertilizer runoff, religious offerings, open defecation); Critical stretches (Ganga: Kanpur to Varanasi; Yamuna: Delhi Wazirabad to Agra); Ecological and human impacts (Waterborne diseases, loss of aquatic fauna like Gangetic dolphin, toxic bioaccumulation); Namami Gange interventions (STP networks, Zero Liquid Discharge, afforestation, rural open-defecation-free riverbanks).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks pollution sources & polluted stretches + 1.5 Marks ecological & public health impacts + 2 Marks Namami Gange interventions):\n\u2022 1. Sources & Critical Polluted Stretches [1.5 Marks]:\n  - Point Sources: Untreated municipal sewage from dense cities alongside industrial effluents from chemical units, tanneries, and paper mills.\n  - Non-Point Sources: Agricultural runoff carrying synthetic fertilizers and pesticides, open defecation, and surface debris.\n  - Critical Stretches: Ganga between Kanpur and Varanasi (heavy organic and tannery waste) and the Yamuna between Wazirabad and Okhla in Delhi (near-zero dissolved oxygen).\n\u2022 2. Ecological & Health Impacts [1.5 Marks]:\n  - High pathogen loads drive waterborne illnesses (cholera, typhoid, hepatitis) in downstream communities.\n  - Eutrophication and dissolved oxygen loss threaten endemic aquatic life, including the endangered Gangetic river dolphin.\n\u2022 3. Namami Gange Interventions [2 Marks]:\n  - Constructing interception and diversion networks and modern Sewage Treatment Plants (STPs).\n  - Mandating real-time effluent tracking for industrial units and promoting ecological flow maintenance alongside riverbank afforestation."}, {"id": 42, "type": "LA", "tag": "CBSE 2024", "question": "\"Rapid urbanization in India is accompanied by acute environmental and infrastructural stress, most visibly manifested in solid waste crises, air pollution, and informal slums.\" Critically analyze this statement with empirical evidence from Indian metropolitan cities. [5 Marks]", "answer": "Critical analysis of urban environmental crises: (1) Municipal solid waste crisis (Massive daily generation, unscientific landfills like Ghazipur/Deonar, leachate groundwater poisoning, fire breakouts); (2) Severe air pollution (Delhi-NCR winter smog, vehicular emissions, thermal plants, PM2.5 lung disease); (3) Informal slums (Dharavi in Mumbai, lack of civic sanitation, high density, vulnerability to pandemics); Policy imperatives (Swachh Bharat Urban, circular economy, public transport).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks solid waste crisis + 1.5 Marks air pollution dynamics + 1.5 Marks slum informal urbanization + 0.5 Mark policy imperatives):\n\u2022 1. Municipal Solid Waste Crisis [1.5 Marks]:\n  - Cities generate thousands of tons of unsegregated waste daily, leading to towering open dumpsites (e.g. Ghazipur in Delhi, Deonar in Mumbai).\n  - These sites generate hazardous leachate that contaminates aquifers and release methane, sparking recurring landfill fires.\n\u2022 2. Air Pollution Crisis [1.5 Marks]:\n  - Metropolitan areas consistently register elevated PM2.5 and PM10 levels from vehicular exhaust, road dust, and construction.\n  - Winter atmospheric inversions in northern cities trap emissions, creating dense smog that aggravates respiratory illnesses.\n\u2022 3. Proliferation of Informal Slums [1.5 Marks]:\n  - High housing costs push low-income migrants into unregularized slums (such as Dharavi in Mumbai), where shared amenities and high density increase health risks.\n\u2022 4. Policy Imperatives [0.5 Mark]:\n  - Addressing these challenges requires source waste segregation, circular recycling, electric public transit, and in-situ slum rehabilitation (PMAY)."}, {"id": 43, "type": "LA", "tag": "CBSE 2023", "question": "Examine the multifaceted causes, types, and geographic spatial distribution of 'Land Degradation' in India. Detail how soil erosion, waterlogging/salinization, and open-cast mining degrade the productive capacity of land, and discuss remediation strategies. [5 Marks]", "answer": "Detailed examination: Land degradation mechanisms; (1) Water erosion (Sheet & gully erosion, Chambal ravines, Shiwalik chos); (2) Wind erosion (Thar desert, shifting sand dunes); (3) Salinization & waterlogging (Excess canal watering in Punjab/Haryana/Rajasthan); (4) Mining & quarrying degradation (Jharkhand, Odisha, MP overburden waste); Remediation: Watershed management, check dams, social forestry, gypsum application, regulated mining backfills.", "explanation": "Step-by-Step Marking Scheme (1.5 Marks soil erosion forms + 1.5 Marks salinization & mining impacts + 2 Marks remediation strategies):\n\u2022 1. Soil Erosion Forms [1.5 Marks]:\n  - Water Erosion: Running water strips topsoil through sheet erosion on bare hillsides and carves deep gullies in semi-arid basins like the Chambal, creating barren ravines.\n  - Wind Erosion: Strong desert winds shift sand dunes in Western Rajasthan, burying adjoining cultivable lands.\n\u2022 2. Salinization, Alkalization, and Mining Scars [1.5 Marks]:\n  - Canal Salinization: Excessive irrigation in poorly drained arid soils (Punjab, Haryana, IG canal zone) raises groundwater tables, drawing mineral salts to the root zone.\n  - Mining Scars: Open-cast excavation in mineral belts (Jharkhand, Odisha, Chhattisgarh) leaves unfilled pits and dumps overburden across agricultural land.\n\u2022 3. Remediation & Restoration Strategies [2 Marks]:\n  - Build check dams, contour trenches, and shelterbelts to stabilize slopes and reduce wind-driven sand drift.\n  - Install sub-surface field drains and apply soil amendments (such as gypsum) to reclaim saline soils, alongside strict enforcement of mine backfilling."}, {"id": 44, "type": "LA", "tag": "CBSE 2023", "question": "Analyze the dynamics of 'Rural-to-Urban Migration' in India. Detail the structural push factors operating in village hinterlands, the pull factors of major cities, and the socio-economic and demographic consequences for both sending and receiving regions. [5 Marks]", "answer": "Analytical exposition: Migration dynamics; Push factors (Population pressure, tiny holdings, drought, poverty, lack of amenities); Pull factors (Industrial wages, education, healthcare, urban lifestyle); Consequences for sending rural areas (Loss of productive young male labor, remittance inflows like 'Money Order Economy', aging female-dominated agriculture); Consequences for receiving cities (Slum growth, overcrowding, strained transport, crime, cultural cosmopolitanism).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks push factors + 1.5 Marks pull factors + 2 Marks consequences on sending and receiving regions):\n\u2022 1. Rural Push Factors [1.5 Marks]:\n  - Land subdivision creates marginal holdings that cannot support households through subsistence farming alone.\n  - Chronic disguised unemployment, seasonal droughts, and limited local schools and clinics push workers to seek urban livelihoods.\n\u2022 2. Urban Pull Factors [1.5 Marks]:\n  - Cities offer perceived opportunities for cash employment in manufacturing, construction, and services.\n  - Access to secondary schools, universities, specialized healthcare, and modern urban infrastructure attracts aspiring rural youth.\n\u2022 3. Consequences on Sending & Receiving Regions [2 Marks]:\n  - Sending Villages: Out-migration of working-age males leaves behind older adults and women, while inward remittances provide basic household purchasing power.\n  - Receiving Cities: Rapid population influx strains housing, water supply, and public transit, driving informal settlement growth and social diversification."}, {"id": 45, "type": "LA", "tag": "CBSE 2022", "question": "Case Study on Dharavi: Examine the physical layout, environmental conditions, informal economic dynamism, and rehabilitation challenges of Asia's most prominent slum settlement in Mumbai. [5 Marks]", "answer": "Comprehensive case study: (1) Geographic location and origin (Heart of Mumbai, former fishing village, marshland reclaim); (2) Physical & sanitary conditions (Overcrowding, narrow alleys, open drains, shared toilets, lack of ventilation); (3) Informal economy ($1B+ turnover, leather tanneries, pottery, garment stitching, plastic recycling); (4) Rehabilitation challenges (High land value, trust deficit between residents and developers, safeguarding informal livelihoods during high-rise redevelopment).", "explanation": "Step-by-Step Marking Scheme (1 Mark geographic location & growth + 1.5 Marks physical/sanitary environment + 1.5 Marks economic dynamism + 1 Mark redevelopment hurdles):\n\u2022 1. Geographic Context & Growth [1 Mark]:\n  - Originally a marshy mangrove island inhabited by Koli fisherfolk, Dharavi grew into an informal settlement in central Mumbai along suburban rail corridors.\n\u2022 2. Living Conditions & Sanitary Challenges [1.5 Marks]:\n  - High population density with families living in tiny multi-level rooms along narrow unpaved alleys.\n  - Lacks internal plumbing; residents rely heavily on shared public toilets, open drainage gullies, and intermittent municipal water standpipes.\n\u2022 3. Informal Economic Dynamos [1.5 Marks]:\n  - Operates as a productive informal industrial center, generating over a billion dollars in estimated annual turnover.\n  - Key enterprises include leather tanning, Kumbharwada pottery, garment manufacturing, and plastic scrap recycling.\n\u2022 4. Redevelopment & Rehabilitation Hurdles [1 Mark]:\n  - High commercial real estate values create complex redevelopment pressures, requiring plans that safeguard informal workshop livelihoods during high-rise construction."}, {"id": 46, "type": "LA", "tag": "CBSE 2021", "question": "Discuss 'Air Pollution' in India with specific reference to metropolitan urban areas. Detail the primary sources of atmospheric contaminants, seasonal exacerbation mechanisms (such as winter inversions and crop residue burning), and health consequences. [5 Marks]", "answer": "Detailed examination: Primary air pollutants (SOx, NOx, CO, Hydrocarbons, PM2.5, PM10); Major sources (Coal thermal plants, vehicular exhaust, construction dust, industrial brick kilns, municipal trash burning); Seasonal dynamics (Winter temperature inversion, stubble burning in Punjab/Haryana, wind stillness creating toxic smog over Indo-Gangetic plain); Severe health consequences (COPD, asthma, lung cancer, child stunted development).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks primary pollutants & emission sources + 2 Marks seasonal dynamics & stubble burning + 1.5 Marks public health consequences):\n\u2022 1. Primary Pollutants & Emission Sources [1.5 Marks]:\n  - Common contaminants include suspended particulate matter (PM2.5 and PM10), sulfur dioxide, nitrogen oxides, and carbon monoxide.\n  - Sourced from vehicular exhaust, coal-fired power plants, brick kilns, construction dust, and open waste burning.\n\u2022 2. Seasonal Smog Dynamics [2 Marks]:\n  - Northern plains experience seasonal smog spikes in winter due to low temperatures and weak surface winds that create atmospheric inversions.\n  - Post-monsoon paddy residue burning across Punjab, Haryana, and western UP releases dense smoke that drifts over Delhi-NCR, accumulating beneath the inversion layer.\n\u2022 3. Public Health Consequences [1.5 Marks]:\n  - Prolonged exposure causes chronic respiratory conditions, including bronchitis, asthma, reduced lung capacity in children, and elevated cardiovascular risks."}, {"id": 47, "type": "LA", "tag": "CBSE 2020", "question": "Evaluate the challenge of 'Municipal Solid Waste Management' in Indian urban centers. Compare conventional open dumping with modern scientific management based on segregation at source, composting, biomethanation, and sanitary landfills. [5 Marks]", "answer": "Comparative evaluation: (1) Crisis of conventional disposal (Unsegregated open dump mounds, methane fires, toxic leachate, disease vectors); (2) Modern scientific framework (Segregation into wet, dry, hazardous waste at doorstep); (3) Processing technologies (Aerobic composting, biomethanation for biogas/electricity, recyclable recovery); (4) Engineered sanitary landfills for inert reject waste; Swachh Bharat Urban guidelines.", "explanation": "Step-by-Step Marking Scheme (1.5 Marks conventional dumping critique + 2 Marks modern processing technologies + 1.5 Marks waste hierarchy & sanitary landfilling):\n\u2022 1. Critique of Conventional Open Dumping [1.5 Marks]:\n  - Unsegregated waste dumped in open landfills generates anaerobic decomposition, releasing flammable methane and foul odors.\n  - Unlined dumps allow toxic leachate to percolate into underlying soils and municipal drinking water aquifers.\n\u2022 2. Modern Processing Technologies [2 Marks]:\n  - Source Segregation: Sorting waste at the household level into wet biodegradable, dry recyclable, and domestic hazardous streams.\n  - Biological Processing: Composting organic wet waste into nutrient-rich manure and using biomethanation to produce biogas and clean electricity.\n\u2022 3. Waste Hierarchy & Engineered Sanitary Landfills [1.5 Marks]:\n  - Recycling plastics, paper, and metals to reduce total landfill volume, sending only inert non-recyclable residue to lined sanitary landfills."}, {"id": 48, "type": "LA", "tag": "CBSE 2019", "question": "\"Degraded wastelands represent an ecological liability, but with integrated scientific watershed interventions, they can be transformed into productive assets.\" Discuss this statement with reference to national wasteland reclamation programs. [5 Marks]", "answer": "Discussion: Extent of wastelands in India (~15-20% of geographical area); Classification (Gullied/ravine land, waterlogged saline land, degraded forest, shifting cultivation land, rocky outcrops); National Wasteland Development Board (NWDB, 1985); Reclamation interventions (Integrated watershed approach, contour bunding, check dams, afforestation, social forestry, silvi-pasture development); Successful models (Sukhomajri, Ralegan Siddhi).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks wasteland types & national extent + 2 Marks scientific watershed interventions + 1.5 Marks socio-ecological outcomes):\n\u2022 1. Types & Extent of Wastelands [1.5 Marks]:\n  - Includes gullied badlands, waterlogged soils, saline tracts, stony quarry areas, and degraded scrub forests lacking commercial productivity.\n\u2022 2. Scientific Watershed Interventions [2 Marks]:\n  - Integrated Watershed Approach: Building contour earthen bunds, vegetative hedges, and check dams across gullies to slow surface runoff and recharge groundwater.\n  - Revegetation & Silvipasture: Planting drought-hardy legumes, shrubs, and native trees (such as Neem, Subabul, and Acacia) to rebuild topsoil organic matter.\n\u2022 3. Socio-Ecological Outcomes [1.5 Marks]:\n  - Case studies like Sukhomajri in Haryana demonstrate that community-managed water harvesting can stabilize degraded slopes and restore farm productivity."}, {"id": 49, "type": "LA", "tag": "CBSE 2018", "question": "Examine the geographic causes and environmental consequences of 'Noise Pollution' in urban India. What regulatory and architectural standards should be enforced to mitigate high noise levels? [5 Marks]", "answer": "Detailed examination: Definition and decibel thresholds (Safe day limit 55 dB, night 45 dB in residential); Major causes (Traffic congestion, incessant honking, construction drills, factory machinery, aircraft flight paths, festival loudspeakers); Environmental & health consequences (Permanent acoustic trauma, sleep deprivation, stress, aggression, cardiac strain, wildlife disorientation); Mitigation: Silent zones around hospitals/schools, acoustic building insulation, noise barriers on expressways, strict ban on pressure horns.", "explanation": "Step-by-Step Marking Scheme (1.5 Marks causes & noise sources + 1.5 Marks health & environmental consequences + 2 Marks mitigation measures):\n\u2022 1. Causes & High-Decibel Sources [1.5 Marks]:\n  - Concentrated road traffic, continuous vehicle honking, railway shunting, and aircraft takeoff corridors near airports.\n  - Construction machinery (jackhammers, pile drivers), industrial factory plants, and amplified loudspeakers during public events.\n\u2022 2. Health & Environmental Consequences [1.5 Marks]:\n  - Prolonged exposure above 80 dB causes sensory hearing fatigue, tinnitus, sleep fragmentation, and elevated blood pressure.\n  - High ambient noise disrupts urban bird life, interfering with communication and nesting behaviors.\n\u2022 3. Mitigation & Regulatory Measures [2 Marks]:\n  - Enforce silent zones around hospitals, schools, and courts with strict penalties for unauthorized loudspeaker and horn use.\n  - Install acoustic sound barriers along elevated highways, mandate double-glazed windows in dense corridors, and expand green vegetative buffers."}, {"id": 50, "type": "LA", "tag": "CBSE 2017", "question": "\"Environmental degradation in India cannot be treated merely as a technological problem; it is fundamentally intertwined with poverty, demographic pressure, and unsustainable consumption patterns.\" Critically analyze this socio-geographic reality. [5 Marks]", "answer": "Critical synthesis: The human-environment nexus; Poverty-environment nexus (Marginalized communities forced into over-exploiting fragile commons, firewood collection, subsistence cultivation on steep slopes); Demographic pressure (High population density fragmenting resources, excessive groundwater mining); Unsustainable affluent consumption (Massive plastic waste, vehicular fossil emissions, luxury water use); Pathway forward: Inclusive sustainable development, environmental justice, circular economy.", "explanation": "Step-by-Step Marking Scheme (1.5 Marks poverty-environment linkages + 1.5 Marks demographic pressures + 1.5 Marks affluent consumption patterns + 0.5 Mark integrated policy synthesis):\n\u2022 1. Poverty-Environment Linkages [1.5 Marks]:\n  - Resource-poor rural households often rely directly on fragile local commons for firewood, grazing, and food, accelerating deforestation when alternatives are absent.\n  - Low-income urban migrants are forced to live in unserviced informal settlements, bearing the brunt of industrial pollution and contaminated water.\n\u2022 2. Demographic Pressures [1.5 Marks]:\n  - High population density intensifies pressure on agricultural soils, driving heavy chemical fertilizer application and groundwater extraction.\n\u2022 3. Unsustainable Consumption Patterns [1.5 Marks]:\n  - Affluent urban lifestyles generate large volumes of single-use plastic waste, high per-capita energy demand, and private vehicular emissions that drive urban smog.\n\u2022 4. Policy Synthesis [0.5 Mark]:\n  - Effective environmental stewardship requires pairing technological solutions with poverty alleviation, resource conservation, and circular economic practices."}]}];
        let currentChapterIdx = 0;
        let currentBookFilter = 'all';
        let currentTypeFilter = 'ALL';
        let searchQuery = '';

        function init() {
            renderSidebar();
            renderChapter(0);
        }

        function switchBook(book) {
            currentBookFilter = book;
            document.querySelectorAll('.nav-tab').forEach((tab, i) => {
                tab.classList.remove('active');
                if ((book === 'all' && i === 0) || (book === 'book1' && i === 1) || (book === 'book2' && i === 2)) {
                    tab.classList.add('active');
                }
            });
            renderSidebar();
        }

        function renderSidebar() {
            const container = document.getElementById('chapterListContainer');
            container.innerHTML = '';

            CHAPTERS_DATA.forEach((ch, idx) => {
                const isBook1 = idx < 8;
                if (currentBookFilter === 'book1' && !isBook1) return;
                if (currentBookFilter === 'book2' && isBook1) return;

                const item = document.createElement('div');
                item.className = 'chapter-item' + (idx === currentChapterIdx ? ' active' : '');
                item.onclick = () => renderChapter(idx);

                const bookLabel = isBook1 ? 'Book 1' : 'Book 2';
                const chNumFormatted = (idx + 1).toString().padStart(2, '0');

                item.innerHTML = `
                    <div class="ch-num">${bookLabel} &bull; Chapter ${chNumFormatted}</div>
                    <div class="ch-title">${ch.info.title}</div>
                    <div class="ch-badge">${ch.questions.length} Questions (50 Qs)</div>
                `;
                container.appendChild(item);
            });
        }

        function filterType(type) {
            currentTypeFilter = type;
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.classList.toggle('active', chip.textContent.includes(type) || (type === 'ALL' && chip.textContent.includes('All Questions')));
            });
            renderChapter(currentChapterIdx);
        }

        function handleSearch() {
            searchQuery = document.getElementById('globalSearch').value.trim().toLowerCase();
            renderChapter(currentChapterIdx);
        }

        function renderChapter(idx) {
            currentChapterIdx = idx;
            renderSidebar();

            const ch = CHAPTERS_DATA[idx];
            const content = document.getElementById('contentArea');

            let filteredQs = ch.questions.filter(q => {
                const matchType = (currentTypeFilter === 'ALL' || q.type === currentTypeFilter);
                const matchSearch = (!searchQuery || 
                    q.question.toLowerCase().includes(searchQuery) ||
                    (q.answer && q.answer.toLowerCase().includes(searchQuery)) ||
                    (q.explanation && q.explanation.toLowerCase().includes(searchQuery)) ||
                    (q.tag && q.tag.toLowerCase().includes(searchQuery))
                );
                return matchType && matchSearch;
            });

            let heroHtml = `
                <div class="chapter-hero">
                    <div class="meta">${ch.info.book} &bull; Chapter ${(idx + 1).toString().padStart(2, '0')}</div>
                    <h2>${ch.info.title}</h2>
                    <div class="weightage">${ch.info.weightage_unit}</div>
                    <div class="stats-summary">
                        <span class="stat-badge">&#128214; Total Qs: ${ch.questions.length}</span>
                        <span class="stat-badge" style="background: #dbeafe; color: #1e40af;">MCQs: 25</span>
                        <span class="stat-badge" style="background: #ede9fe; color: #5b21b6;">A/R: 5</span>
                        <span class="stat-badge" style="background: #d1fae5; color: #065f46;">SA (3M): 10</span>
                        <span class="stat-badge" style="background: #fef3c7; color: #92400e;">LA (5M): 10</span>
                    </div>
                </div>
            `;

            let questionsHtml = '';
            if (filteredQs.length === 0) {
                questionsHtml = `<div style="text-align: center; padding: 40px; color: var(--text-muted);">No questions match your current filters.</div>`;
            } else {
                filteredQs.forEach((q, qIndex) => {
                    let optionsHtml = '';
                    if (q.options && q.options.length > 0) {
                        optionsHtml = `<div class="options-grid" id="opt-grid-${idx}-${q.id}">`;
                        q.options.forEach((opt, optIdx) => {
                            optionsHtml += `<div class="option-item" onclick="checkOption(this, '${opt.replace(/'/g, "\'") }', '${q.answer.replace(/'/g, "\'") }', 'ans-${idx}-${q.id}')">${opt}</div>`;
                        });
                        optionsHtml += `</div>`;
                    }

                    questionsHtml += `
                        <div class="q-card" id="qcard-${idx}-${q.id}">
                            <div class="q-header">
                                <div class="q-badges">
                                    <span class="badge-type type-${q.type}">${q.type} (${q.type === 'MCQ' || q.type === 'AR' ? '1 Mark' : (q.type === 'SA' ? '3 Marks' : '5 Marks') })</span>
                                    <span class="badge-tag">${q.tag}</span>
                                </div>
                                <span class="q-num">Q${q.id} of 50</span>
                            </div>
                            <div class="q-text">${q.question}</div>
                            ${optionsHtml}
                            <button class="toggle-ans-btn" onclick="toggleAnswer('ans-${idx}-${q.id}')">
                                &#9654; Show Marking Scheme / Answer
                            </button>
                            <div class="answer-box" id="ans-${idx}-${q.id}">
                                <div class="ans-label">Correct Answer / Model Response:</div>
                                <div class="ans-text">${q.answer}</div>
                                <div class="ans-label" style="margin-top: 8px;">Point-by-Point Marking Scheme & Stepwise Evaluation:</div>
                                <div class="explanation-text">${q.explanation}</div>
                            </div>
                        </div>
                    `;
                });
            }

            content.innerHTML = heroHtml + questionsHtml;
        }

        function checkOption(el, chosen, correct, ansBoxId) {
            const grid = el.parentElement;
            grid.querySelectorAll('.option-item').forEach(item => {
                item.classList.remove('selected-correct', 'selected-wrong');
            });

            const isCorrect = chosen.trim().startsWith(correct.trim().substring(0, 3)) || chosen.trim() === correct.trim();
            if (isCorrect) {
                el.classList.add('selected-correct');
            } else {
                el.classList.add('selected-wrong');
                // Highlight the correct one
                grid.querySelectorAll('.option-item').forEach(item => {
                    if (item.textContent.trim().startsWith(correct.trim().substring(0, 3))) {
                        item.classList.add('selected-correct');
                    }
                });
            }
            document.getElementById(ansBoxId).classList.add('visible');
        }

        function toggleAnswer(id) {
            const box = document.getElementById(id);
            box.classList.toggle('visible');
        }

        function toggleAllAnswers(show) {
            document.querySelectorAll('.answer-box').forEach(box => {
                if (show) box.classList.add('visible');
                else box.classList.remove('visible');
            });
        }

        window.onload = init;
    </script>
</body>
</html>
