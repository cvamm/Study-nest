e total usable water resources available from both surface water and replenishable groundwater in India is estimated at approximately:", "options": ["(a) 1,122 cubic km", "(b) 4,000 cubic km", "(c) 1,869 cubic km", "(d) 690 cubic km"], "answer": "(a) 1,122 cubic km", "explanation": "Out of total precipitation and surface-groundwater flows, only about 1,122 cubic km (690 surface + 432 groundwater) can be utilized due to topographical and hydrological limits."}, {"id": 7, "type": "MCQ", "tag": "CBSE 2021", "question": "The 'Neeru-Meeru' (Water and You) watershed conservation and rainwater harvesting program was launched by which state government?", "options": ["(a) Andhra Pradesh", "(b) Tamil Nadu", "(c) Karnataka", "(d) Madhya Pradesh"], "answer": "(a) Andhra Pradesh", "explanation": "The Neeru-Meeru program was initiated in Andhra Pradesh to promote community participation in building check dams and percolation tanks."}, {"id": 8, "type": "MCQ", "tag": "CBSE 2020 Delhi", "question": "Groundwater in parts of West Bengal and Bihar is severely contaminated by high concentrations of which toxic chemical element?", "options": ["(a) Arsenic", "(b) Fluoride", "(c) Lead", "(d) Mercury"], "answer": "(a) Arsenic", "explanation": "Over-extraction of groundwater in deltaic West Bengal and parts of Bihar has mobilized natural subterranean arsenic, causing arsenicosis among consumers."}, {"id": 9, "type": "MCQ", "tag": "CBSE 2020 AI", "question": "Which model village in Ahmadnagar district of Maharashtra was transformed into an economically prosperous, water-secure community under the leadership of Anna Hazare through watershed management?", "options": ["(a) Ralegan Siddhi", "(b) Hiware Bazar", "(c) Sukhomajri", "(d) Kothapally"], "answer": "(a) Ralegan Siddhi", "explanation": "Ralegan Siddhi in Ahmadnagar, Maharashtra, became a recognized model of participatory watershed development led by Anna Hazare."}, {"id": 10, "type": "MCQ", "tag": "CBSE 2019", "question": "According to the National Water Policy of India, which sector has been accorded the HIGHEST priority in the allocation of water resources?", "options": ["(a) Drinking water", "(b) Industrial cooling", "(c) Hydro-electric power", "(d) Commercial navigation"], "answer": "(a) Drinking water", "explanation": "The National Water Policy establishes drinking water as the first priority in water allocation, followed by irrigation, hydropower, and industry."}, {"id": 11, "type": "MCQ", "tag": "CBSE 2019", "question": "High concentration of 'Fluoride' in groundwater due to over-extraction is a serious public health hazard primarily in parts of:", "options": ["(a) Rajasthan and Maharashtra", "(b) Meghalaya and Assam", "(c) Kerala and Goa", "(d) Jammu and Kashmir"], "answer": "(a) Rajasthan and Maharashtra", "explanation": "Excessive groundwater withdrawal in arid and semi-arid tracts of Rajasthan and Maharashtra has increased fluoride concentrations, causing fluorosis."}, {"id": 12, "type": "MCQ", "tag": "CBSE 2018", "question": "Which river basin in India accounts for the largest share of total surface water resources (over 40%)?", "options": ["(a) Ganga-Brahmaputra Basin", "(b) Indus Basin", "(c) Godavari Basin", "(d) Narmada Basin"], "answer": "(a) Ganga-Brahmaputra Basin", "explanation": "The Ganga-Brahmaputra-Meghna basin accounts for over 44% of India's total surface water flow, supported by Himalayan meltwater and monsoon rains."}, {"id": 13, "type": "MCQ", "tag": "CBSE 2018", "question": "Brackish water lagoons and backwaters in Kerala (Kayals) and Odisha (Chilika Lake) are utilized primarily for:", "options": ["(a) Fishing and irrigating specific salt-tolerant paddy varieties and coconut groves", "(b) Urban drinking water supplies", "(c) Operating hydro-electric turbines", "(d) Paper and chemical bleaching"], "answer": "(a) Fishing and irrigating specific salt-tolerant paddy varieties and coconut groves", "explanation": "Coastal lagoons and backwaters support inland fisheries and salt-tolerant paddy crops, as well as water transport."}, {"id": 14, "type": "MCQ", "tag": "CBSE 2017", "question": "What proportion of the world's total water resources does India possess relative to its share of global population?", "options": ["(a) 4% of water resources for 17.5% of world population", "(b) 25% of water resources for 2% of world population", "(c) 50% of water resources for 50% of world population", "(d) 10% of water resources for 5% of world population"], "answer": "(a) 4% of water resources for 17.5% of world population", "explanation": "India holds roughly 4% of global freshwater resources while supporting 17.5% of the world's population on 2.45% of total land area."}, {"id": 15, "type": "MCQ", "tag": "CBSE 2017", "question": "Which of the following is an effective method to arrest 'Saltwater Intrusion' in coastal aquifers?", "options": ["(a) Artificial recharge of coastal aquifers through rainwater harvesting structures", "(b) Over-pumping groundwater using deep borewells", "(c) Removing all mangrove forests", "(d) Dumping municipal sewage into sand dunes"], "answer": "(a) Artificial recharge of coastal aquifers through rainwater harvesting structures", "explanation": "Recharging coastal aquifers raises the freshwater table, creating hydraulic pressure that prevents saline seawater from seeping inland."}, {"id": 16, "type": "MCQ", "tag": "CBSE 2016", "question": "Which two rivers in India are officially identified as having the most heavily polluted river stretches due to municipal sewage and industrial effluent discharge?", "options": ["(a) Ganga and Yamuna", "(b) Narmada and Tapi", "(c) Brahmaputra and Barak", "(d) Chenab and Jhelum"], "answer": "(a) Ganga and Yamuna", "explanation": "The Ganga (along Kanpur-Varanasi) and the Yamuna (between Delhi and Agra) have heavily polluted stretches due to untreated municipal and industrial waste."}, {"id": 17, "type": "MCQ", "tag": "CBSE 2016", "question": "The total replenishable groundwater resource of India is estimated at approximately:", "options": ["(a) 433 cubic km", "(b) 1,869 cubic km", "(c) 690 cubic km", "(d) 4,000 cubic km"], "answer": "(a) 433 cubic km", "explanation": "The Central Ground Water Board estimates India's total replenishable groundwater resources at roughly 433 cubic kilometers annually."}, {"id": 18, "type": "MCQ", "tag": "CBSE 2015", "question": "In which region of India is groundwater utilization exceptionally LOW (under 20%), indicating immense untapped groundwater potential?", "options": ["(a) North-Eastern states, Chhattisgarh, and Odisha", "(b) Punjab and Haryana", "(c) Western Rajasthan", "(d) Tamil Nadu"], "answer": "(a) North-Eastern states, Chhattisgarh, and Odisha", "explanation": "High rainfall and lower agricultural extraction in the North-Eastern states, Chhattisgarh, and Odisha leave large groundwater reserves untapped."}, {"id": 19, "type": "MCQ", "tag": "CBSE 2024", "question": "The 'Jal Kranti Abhiyan' launched by the Government of India in 2015\u201316 aimed at:", "options": ["(a) Ensuring water security through active involvement of local stakeholders and creating 'Jal Grams' in each district", "(b) Banning all canal irrigation in India", "(c) Merging all Indian rivers into a single pipe", "(d) Converting all lakes into parking lots"], "answer": "(a) Ensuring water security through active involvement of local stakeholders and creating 'Jal Grams' in each district", "explanation": "The Jal Kranti Abhiyan targeted water security through local community engagement, establishing model 'Jal Grams' across districts."}, {"id": 20, "type": "MCQ", "tag": "CBSE 2023", "question": "Which peninsular river basin in India exhibits the HIGHEST percentage utilization of its available surface water resources?", "options": ["(a) Godavari, Krishna, and Cauvery", "(b) Brahmaputra", "(c) Subarnarekha", "(d) Barak"], "answer": "(a) Godavari, Krishna, and Cauvery", "explanation": "Due to dry seasonal conditions and extensive canal networks, southern river basins (Godavari, Krishna, Cauvery) utilize most of their surface runoff."}, {"id": 21, "type": "MCQ", "tag": "CBSE 2022", "question": "Which of the following is NOT an objective of Watershed Management?", "options": ["(a) Encouraging unchecked industrial dumping of untreated effluents into natural streams", "(b) Conservation of surface and groundwater resources", "(c) Prevention of soil runoff and recharge of aquifers", "(d) Afforestation and pasture development"], "answer": "(a) Encouraging unchecked industrial dumping of untreated effluents into natural streams", "explanation": "Watershed management aims to conserve soil and water resources; industrial dumping causes environmental damage and directly violates these goals."}, {"id": 22, "type": "MCQ", "tag": "CBSE 2021", "question": "Percolation tanks, check dams, and recharge shafts are primarily constructed to:", "options": ["(a) Facilitate artificial groundwater recharge and prevent rapid surface runoff", "(b) Speed up soil erosion", "(c) Drain all water into the ocean quickly", "(d) Evaporate water into the sky"], "answer": "(a) Facilitate artificial groundwater recharge and prevent rapid surface runoff", "explanation": "Percolation tanks and check dams slow surface runoff, allowing rainwater to infiltrate into the ground and replenish local aquifers."}, {"id": 23, "type": "MCQ", "tag": "CBSE 2020", "question": "What is the annual precipitation received across India in an average year?", "options": ["(a) Approximately 4,000 cubic km", "(b) 1,122 cubic km", "(c) 690 cubic km", "(d) 10,000 cubic km"], "answer": "(a) Approximately 4,000 cubic km", "explanation": "India receives an estimated 4,000 cubic km of precipitation annually, predominantly during the summer monsoon months."}, {"id": 24, "type": "MCQ", "tag": "CBSE 2019", "question": "The Central Pollution Control Board (CPCB) in collaboration with State Pollution Control Boards monitors river water quality across India under which national monitoring program?", "options": ["(a) National Water Quality Monitoring Programme (NWMP)", "(b) NASA Satellite Mission", "(c) World Meteorological Bureau", "(d) United Nations Maritime Council"], "answer": "(a) National Water Quality Monitoring Programme (NWMP)", "explanation": "The CPCB monitors aquatic health and water quality parameters across major rivers under the National Water Quality Monitoring Programme."}, {"id": 25, "type": "MCQ", "tag": "CBSE 2018", "question": "The primary cause of the critical decline in groundwater tables across Punjab and Haryana over the past four decades is:", "options": ["(a) Intensive tubewell-based flood irrigation for water-demanding crops like paddy and wheat", "(b) Heavy evaporation due to volcanic heat", "(c) Absorption of groundwater by coal mines", "(d) Export of unbottled groundwater to Canada"], "answer": "(a) Intensive tubewell-based flood irrigation for water-demanding crops like paddy and wheat", "explanation": "Electrified and subsidized tubewell pumping for water-intensive rice and wheat crops has led to groundwater extraction exceeding natural recharge rates."}, {"id": 26, "type": "AR", "tag": "CBSE 2024", "question": "Assertion (A): Rainwater harvesting is an effective, sustainable method for resolving India's water crisis.\nReason (R): It captures surface runoff to recharge depleted groundwater aquifers, prevents urban waterlogging, and mitigates saltwater intrusion in coastal areas.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true and (R) explains (A). Rainwater harvesting captures seasonal monsoon rainfall to replenish aquifers and improve water security."}, {"id": 27, "type": "AR", "tag": "CBSE 2023", "question": "Assertion (A): Over-extraction of groundwater in the states of Punjab, Haryana, and Western Uttar Pradesh has led to severe aquifer depletion.\nReason (R): Introduction of the Green Revolution technology required assured, intensive tubewell irrigation for high-water-consuming paddy and wheat crops.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true and (R) explains (A). Intensive pumping for paddy-wheat crop cycles has outpaced annual monsoon recharge across northwestern states."}, {"id": 28, "type": "AR", "tag": "CBSE 2022", "question": "Assertion (A): The agricultural sector accounts for negligible water consumption in India, using less than 1 percent of all available water.\nReason (R): Indian crops are grown exclusively inside sealed computerized glasshouses that require zero water input.", "options": ["(a) Both (A) and (R) are true", "(b) Both (A) and (R) are false", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(b) Both (A) and (R) are false", "explanation": "Both statements are false: Agriculture is India's largest water consumer, using roughly 89% of surface water and 92% of groundwater for irrigation."}, {"id": 29, "type": "AR", "tag": "CBSE 2021", "question": "Assertion (A): In parts of West Bengal and Bihar, high concentrations of arsenic have been detected in groundwater extracted through tubewells.\nReason (R): Excessive drawdown of groundwater levels causes geochemical reactions that release natural arsenic from underground geological formations into the aquifer.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true. Heavy tubewell pumping lowers the water table, exposing underground arsenopyrite minerals to oxygen and releasing soluble arsenic."}, {"id": 30, "type": "AR", "tag": "CBSE 2020", "question": "Assertion (A): Watershed management projects focus entirely on constructing mega-concrete dams across major international rivers.\nReason (R): Watershed management explicitly forbids the participation of local village communities and Gram Panchayats.", "options": ["(a) Both (A) and (R) are true", "(b) Both (A) and (R) are false", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(b) Both (A) and (R) are false", "explanation": "Both statements are false: Watershed management focuses on local, decentralized conservation (check dams, percolation ponds) driven by community and panchayat involvement."}, {"id": 31, "type": "SA", "tag": "CBSE 2024", "question": "Explain the concept of 'Watershed Management'. State any two of its primary objectives. [3 Marks]", "answer": "Efficient conservation of surface and groundwater in a drainage basin; Objectives: 1. Soil and water conservation; 2. Enhancing community livelihoods.", "explanation": "Marking Scheme (1 Mark concept + 2 Marks primary objectives):\n\u2022 Concept: The coordinated conservation and management of natural resources (water, soil, vegetation) within a defined drainage basin or watershed.\n\u2022 Primary Objectives:\n  1. Water & Soil Conservation: Slowing surface runoff through check dams, percolation tanks, and afforestation to recharge aquifers and prevent topsoil erosion.\n  2. Sustainable Rural Livelihoods: Increasing biomass production, crop yields, and fodder availability through participatory community management."}, {"id": 32, "type": "SA", "tag": "CBSE 2024", "question": "Why is the demand for water in the agricultural sector exceptionally high in India? State three reasons. [3 Marks]", "answer": "1. Spatial and temporal variation of monsoon; 2. Multiple cropping in dry Rabi/Zaid seasons; 3. Cultivation of water-intensive crops (rice, sugarcane).", "explanation": "Marking Scheme (1 Mark for each reason):\n\u2022 1. Erratic Monsoon Rainfall: Rainfall is concentrated into 3\u20134 summer months and distributed unevenly, requiring irrigation during dry spells.\n\u2022 2. Winter & Summer Cropping: Multi-cropping during the dry Rabi and Zaid seasons depends on artificial irrigation.\n\u2022 3. Water-Intensive Crops: Cultivation of crops like wet paddy, sugarcane, and jute requires large, sustained applications of water."}, {"id": 33, "type": "SA", "tag": "CBSE 2023", "question": "Describe the success of the 'Ralegan Siddhi' watershed management program led by Anna Hazare. [3 Marks]", "answer": "Transformed drought-prone village into water-secure model; check dams and percolation tanks; voluntary labor (shramdaan); social bans.", "explanation": "Marking Scheme (1 Mark physical structures + 1 Mark community involvement + 1 Mark economic transformation):\n\u2022 Conservation Infrastructure: Constructed contour trenches, check dams, and percolation tanks across hillsides to trap rainwater.\n\u2022 Community Involvement: Mobilized community labor (shramdaan) along with social commitments banning open grazing, tree felling, and water-intensive sugarcane.\n\u2022 Economic Transformation: Recharged dried wells, enabled year-round cropping, and transformed a drought-affected village into a self-sufficient community."}, {"id": 34, "type": "SA", "tag": "CBSE 2023", "question": "What is 'Rainwater Harvesting'? Mention any four of its major benefits. [3 Marks]", "answer": "Capturing and storing rainwater for reuse and recharge; Benefits: Recharges aquifers, checks water table decline, prevents flooding, arrests coastal salinity.", "explanation": "Marking Scheme (1 Mark definition + 2 Marks for four benefits):\n\u2022 Definition: The technique of capturing, collecting, and directing rainwater runoff from roofs and land surfaces into storage tanks or underground aquifers.\n\u2022 Major Benefits:\n  1. Recharges depleted groundwater reserves and raises local water tables.\n  2. Reduces urban storm runoff and prevents localized street waterlogging.\n  3. Lowers water bills by providing an alternative non-potable supply.\n  4. Recharges coastal aquifers, creating hydraulic barriers that counter saltwater intrusion."}, {"id": 35, "type": "SA", "tag": "CBSE 2022", "question": "Explain the major causes of the deterioration of water quality in Indian rivers. [3 Marks]", "answer": "Untreated municipal sewage, industrial chemical effluents, agricultural chemical runoff, and religious immersion/pilgrim waste.", "explanation": "Marking Scheme (1 Mark each for key pollution vectors):\n\u2022 1. Municipal Sewage: Untreated domestic wastewater discharged into rivers from growing urban centers along river corridors.\n\u2022 2. Industrial Effluents: Heavy metals, dyes, and chemical wastes dumped without treatment by tanneries, paper mills, and textile units.\n\u2022 3. Agricultural Runoff: Fertilizer nitrates and pesticides carried into drainage streams by irrigation runoff, causing eutrophication."}, {"id": 36, "type": "SA", "tag": "CBSE 2022", "question": "Highlight the key priorities outlined in the 'National Water Policy' of India. [3 Marks]", "answer": "1. Drinking water as first priority; 2. Regulating groundwater extraction; 3. Promoting water conservation and conjunctive use.", "explanation": "Marking Scheme (1 Mark for each policy priority):\n\u2022 1. Allocation Hierarchy: Designates drinking water as the first allocation priority, followed by irrigation, hydropower, navigation, and industry.\n\u2022 2. Groundwater Regulation: Promotes legal frameworks to prevent over-extraction and encourage artificial recharge.\n\u2022 3. Integrated Water Management: Encourages conjunctive use of surface and groundwater, water audits, and public awareness campaigns."}, {"id": 37, "type": "SA", "tag": "CBSE 2020", "question": "What are 'Lagoons and Backwaters'? How are they utilized in Kerala and Odisha? [3 Marks]", "answer": "Shallow water bodies separated from sea by barrier reefs; brackish water; utilized for fishing, salt-tolerant paddy, and transport/tourism.", "explanation": "Marking Scheme (1.5 Marks definition + 1.5 Marks economic utilization):\n\u2022 Nature: Shallow coastal water bodies separated from the open sea by barrier islands and sandbars (e.g. Kerala Kayals and Chilika Lake in Odisha).\n\u2022 Economic Utilization: Used for inland fishing, water transit, cultivating salt-tolerant paddy varieties, coconut cultivation, and eco-tourism."}, {"id": 38, "type": "SA", "tag": "CBSE 2019", "question": "Explain how over-extraction of groundwater leads to 'Arsenic' and 'Fluoride' contamination in India. [3 Marks]", "answer": "Over-pumping lowers water tables, inducing geochemical leaching: Arsenic in West Bengal/Bihar; Fluoride in Rajasthan/Maharashtra.", "explanation": "Marking Scheme (1.5 Marks Arsenic mechanism + 1.5 Marks Fluoride mechanism):\n\u2022 Arsenic Leaching: Heavy drawdown in West Bengal and Bihar lowers water tables, exposing arsenopyrite minerals to oxygen and releasing soluble arsenic into drinking aquifers.\n\u2022 Fluoride Concentration: In arid Rajasthan and Maharashtra, over-pumping draws water from deeper granitic strata, increasing fluoride concentrations."}, {"id": 39, "type": "SA", "tag": "CBSE 2018", "question": "Describe the watershed management program 'Haryali'. Who executes it? [3 Marks]", "answer": "Central government-sponsored watershed project; executed by Gram Panchayats; enables rural communities to conserve water for farming, drinking, and afforestation.", "explanation": "Marking Scheme (1.5 Marks program features + 1.5 Marks execution mechanism):\n\u2022 Program Focus: A central government-sponsored watershed initiative aimed at rainwater harvesting for irrigation, drinking, tree planting, and fisheries.\n\u2022 Execution Mechanism: Implemented through Gram Panchayats with community participation, focusing on decentralized, local resource management."}, {"id": 40, "type": "SA", "tag": "CBSE 2017", "question": "Why is the utilization of groundwater very high in northwestern India compared to eastern India? [3 Marks]", "answer": "Northwest (Green Revolution, high irrigation demand for wheat/paddy, low rainfall); East (Abundant monsoon rainfall, slower tubewell electrification).", "explanation": "Marking Scheme (1.5 Marks Northwest factors + 1.5 Marks Eastern factors):\n\u2022 Northwestern India (Punjab, Haryana, Rajasthan):\n  - Lower rainfall and intensive Green Revolution multi-cropping require heavy tubewell irrigation for paddy and wheat, resulting in over 85\u2013100% groundwater utilization.\n\u2022 Eastern India (Bihar, Odisha, West Bengal):\n  - Higher monsoon rainfall and slower tubewell electrification have left large groundwater reserves available for future development."}, {"id": 41, "type": "LA", "tag": "CBSE 2024", "question": "Examine the availability, sectoral utilization, and spatial distribution of 'Water Resources' in India. Why does India face severe water stress despite receiving 4,000 cubic km of annual precipitation? [5 Marks]", "answer": "Comprehensive examination: Water resources balance sheet (4,000 cu km precipitation, 1,869 surface/groundwater flow, 1,122 usable); Sectoral utilization (Agriculture 89% surface, 92% groundwater); Spatial and temporal mismatch (Monsoon concentration, floods vs droughts, over-exploitation in NW).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks water balance sheet + 1.5 Marks sectoral utilization + 2 Marks paradox of water stress):\n\u2022 1. National Water Resources Balance Sheet [1.5 Marks]:\n  - Annual precipitation provides approximately 4,000 cubic km of water, resulting in an estimated 1,869 cubic km of surface and replenishable groundwater flow.\n  - However, due to topographical, geological, and hydrological limits, only about 1,122 cubic km (690 surface + 432 groundwater) can be utilized.\n\u2022 2. Sectoral Utilization Dynamics [1.5 Marks]:\n  - Agriculture is the dominant user, accounting for 89% of surface water and 92% of groundwater extractions, primarily for irrigation.\n  - Domestic and industrial sectors account for the remainder, but their water demands are growing rapidly.\n\u2022 3. Why India Faces Water Stress [2 Marks]:\n  - Seasonal Concentration: 75% of rainfall arrives during the short southwest monsoon, causing seasonal runoff losses.\n  - Regional Disparities: Water abundance in the Brahmaputra basin contrasts with acute shortages in peninsular and arid western regions, compounded by groundwater depletion in northwestern agricultural belts."}, {"id": 42, "type": "LA", "tag": "CBSE 2024", "question": "Discuss 'Watershed Management' as an integrated strategy for sustainable resource conservation. Detail the approaches, community participation models, and successful case studies (Ralegan Siddhi, Haryali, Neeru-Meeru, Arvary Pani Sansad). [5 Marks]", "answer": "Comprehensive examination: Concept of watershed management (Conserving soil, water, biomass); Community models: Ralegan Siddhi (Anna Hazare, check dams, social bans); Haryali (Central govt via Panchayats); Neeru-Meeru (Andhra Pradesh); Arvary Pani Sansad (Alwar, Johads).", "explanation": "Step-by-Step Marking Scheme (1 Mark concept + 1 Mark each for the four case studies, max 5 Marks):\n\u2022 1. Concept of Integrated Watershed Management [1 Mark]:\n  - Coordinates the conservation of surface water, groundwater, soil, and vegetation within a natural drainage basin to prevent erosion, recharge aquifers, and improve yields.\n\u2022 2. Ralegan Siddhi (Maharashtra) [1 Mark]:\n  - Led by Anna Hazare, combining check dams and contour trenches with community labor and social compacts banning open grazing and water-intensive crops.\n\u2022 3. Haryali Program [1 Mark]:\n  - A central government initiative implemented by Gram Panchayats, supporting village rainwater harvesting for irrigation, drinking, and fisheries.\n\u2022 4. Neeru-Meeru (Andhra Pradesh) [1 Mark]:\n  - Mobilized local communities to construct water-harvesting pits, check dams, and percolation tanks to improve groundwater levels.\n\u2022 5. Arvary Pani Sansad (Alwar, Rajasthan) [1 Mark]:\n  - Revitalized dried-up streams across drought-affected areas by constructing traditional earthen check dams (johads) through collective community participation."}, {"id": 43, "type": "LA", "tag": "CBSE 2023", "question": "Explain 'Rainwater Harvesting' (RWH) as an indispensable water conservation technique. Discuss traditional versus modern methods, its multi-dimensional benefits, and Tamil Nadu's pioneering mandatory legislation. [5 Marks]", "answer": "Detailed examination: Concept of RWH; Traditional methods (Khadins, Johads, Kunds in Rajasthan, Zing in Ladakh, Ahar-Pyne in Bihar); Modern rooftop RWH (Pipes, filtration, recharge pits); Multi-dimensional benefits; Tamil Nadu's mandatory framework.", "explanation": "Step-by-Step Marking Scheme (1.5 Marks RWH concepts & traditional systems + 1.5 Marks modern rooftop methods & benefits + 2 Marks Tamil Nadu case study):\n\u2022 1. Concept & Traditional Harvesting Systems [1.5 Marks]:\n  - The practice of capturing and storing rainwater runoff for productive use and aquifer recharge.\n  - Traditional systems include Johads and Kunds in Rajasthan, Zings in Ladakh, Ahar-Pynes in Bihar, and Kulhs in Himachal Pradesh.\n\u2022 2. Modern Methods & Multi-Dimensional Benefits [1.5 Marks]:\n  - Directs rooftop runoff through filters into percolation pits, borewells, or storage sumps.\n  - Recharges local aquifers, lowers municipal water demand, mitigates urban flooding, and counters coastal saltwater intrusion.\n\u2022 3. Tamil Nadu's Mandatory Legislation [2 Marks]:\n  - The first state in India to make rooftop rainwater harvesting legally mandatory for all buildings in 2001, backed by building code requirements and penalties for non-compliance.\n  - Successfully stabilized water tables and reduced urban water shortages in Chennai and surrounding districts."}, {"id": 44, "type": "LA", "tag": "CBSE 2023", "question": "Examine the crisis of 'Groundwater Depletion' in India. Identify the over-exploited states, analyze the economic and agricultural drivers, and discuss resultant environmental consequences (fluoride and arsenic contamination, salinization). [5 Marks]", "answer": "Comprehensive examination: Crisis status (Central Ground Water Board classifications); Over-exploited states (Punjab, Haryana, Rajasthan, Tamil Nadu >85%); Agricultural drivers (Subsidized power, tubewell boom, rice-wheat cycle); Consequences: Falling water tables, arsenic in Bengal/Bihar, fluoride in Rajasthan, coastal seawater intrusion.", "explanation": "Step-by-Step Marking Scheme (1.5 Marks geographic distribution of over-exploited zones + 1.5 Marks economic & agricultural drivers + 2 Marks environmental & health consequences):\n\u2022 1. Over-Exploited Zones [1.5 Marks]:\n  - Groundwater extraction exceeds natural recharge in Punjab (149%), Haryana (135%), Rajasthan (140%), and Tamil Nadu.\n\u2022 2. Economic & Agricultural Drivers [1.5 Marks]:\n  - The Green Revolution encouraged tubewell irrigation for water-demanding crops like paddy and wheat in semi-arid areas.\n  - Subsidized or unmetered agricultural electricity created incentives for continuous, unmonitored pumping.\n\u2022 3. Environmental & Public Health Consequences [2 Marks]:\n  - Depleted water tables increase pumping costs and dry up shallow community wells.\n  - Deep water extraction draws on mineralized strata, increasing arsenic contamination in West Bengal and Bihar and fluoride levels in Rajasthan and Maharashtra."}, {"id": 45, "type": "LA", "tag": "CBSE 2022", "question": "Discuss the 'Pollution of River Waters' in India. Identify the most critical polluted river stretches, examine industrial and municipal pollution sources, and evaluate the Namami Gange and National River Conservation plans. [5 Marks]", "answer": "Detailed examination: River pollution crisis; Highly polluted stretches (Ganga: Kannauj to Varanasi; Yamuna: Delhi to Agra; Sabarmati, Mithi); Sources: Municipal sewage (80%), Industrial effluents (chemical, tanneries), Agricultural runoff; Policy initiatives: Namami Gange mission, sewage treatment plants, riverfront regulation.", "explanation": "Step-by-Step Marking Scheme (1.5 Marks polluted stretches & river systems + 1.5 Marks pollution vectors + 2 Marks Namami Gange & policy evaluation):\n\u2022 1. Critical Polluted River Stretches [1.5 Marks]:\n  - The Ganga along industrial belts (Kannauj, Kanpur, Varanasi) and the Yamuna between Wazirabad and the Chambal confluence in Delhi and Agra are heavily polluted.\n  - The Sabarmati in Ahmedabad, the Mithi in Mumbai, and the Gomti in Lucknow also carry heavy pollution loads.\n\u2022 2. Major Pollution Sources [1.5 Marks]:\n  - Domestic Sewage: Discharges of untreated municipal wastewater from cities along riverbanks.\n  - Industrial Waste: Untreated effluents from chemical factories, textile dye plants, tanneries, and distilleries, along with agricultural pesticide runoff.\n\u2022 3. Policy Interventions: Namami Gange [2 Marks]:\n  - Launched as an integrated conservation mission to clean the Ganga and its tributaries.\n  - Focuses on constructing Sewage Treatment Plants (STPs), monitoring industrial effluents, developing rural sanitation, and afforesting riparian buffers."}, {"id": 46, "type": "LA", "tag": "CBSE 2021", "question": "Examine the salient features, priorities, and implementation guidelines of the 'National Water Policy' of India. How does it advocate for integrated water resource management (IWRM)? [5 Marks]", "answer": "Detailed examination: National Water Policy; Core priorities: Drinking water first, followed by irrigation, hydropower, navigation, industry; Integrated Water Resource Management (Conjunctive use of surface/groundwater, river basin organizations, water pricing, demand management, participatory irrigation).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks core priorities & allocation hierarchy + 2 Marks IWRM principles + 1.5 Marks conservation guidelines):\n\u2022 1. Allocation Hierarchy & Core Priorities [1.5 Marks]:\n  - Establishes drinking water as the first allocation priority, followed by irrigation, hydropower, commercial navigation, and industrial use.\n\u2022 2. Integrated Water Resource Management (IWRM) [2 Marks]:\n  - Treats river basins as unified hydrological units rather than managing them by state administrative boundaries.\n  - Encourages the conjunctive use of surface water and groundwater to balance seasonal availability and prevent aquifer depletion.\n\u2022 3. Demand Management & Conservation [1.5 Marks]:\n  - Advocates for water pricing to encourage conservation, periodic water audits, and expanding participatory irrigation management through Water Users Associations (WUAs)."}, {"id": 47, "type": "LA", "tag": "CBSE 2020", "question": "Assess the potential of 'Lagoons, Backwaters, and Inland Lakes' in India's water economy. Discuss their geographical occurrence, economic utilization, and environmental vulnerabilities. [5 Marks]", "answer": "Assessment: Coastal lagoons (Chilika Lake in Odisha, Pulicat in AP/TN, Vembanad and Kayals in Kerala); Inland lakes; Economic uses: Brackish fisheries, salt-tolerant agriculture (Pokkali rice in Kerala), coir retting, boat transport, tourism; Vulnerabilities: Siltation, plastic pollution, sewage dumping.", "explanation": "Step-by-Step Marking Scheme (1.5 Marks geographic occurrence + 2 Marks economic utilization + 1.5 Marks environmental vulnerabilities):\n\u2022 1. Geographical Occurrence [1.5 Marks]:\n  - Prominent along the indented coastline: Kerala's backwaters (Vembanad, Ashtamudi), Odisha's Chilika Lake, and Andhra Pradesh's Pulicat Lake.\n\u2022 2. Economic Utilization [2 Marks]:\n  - Supports inland brackish fisheries, shrimp farming, and salt-tolerant paddy cultivation (e.g. Pokkali rice in Kerala).\n  - Provides inland water transport routes, coir retting facilities, and popular tourist backwater cruises.\n\u2022 3. Environmental Vulnerabilities [1.5 Marks]:\n  - Sensitive to agricultural runoff, untreated municipal sewage, and catchment deforestation that causes siltation and shrinks water surface areas."}, {"id": 48, "type": "LA", "tag": "CBSE 2019", "question": "\"Water recycling, reuse, and wastewater treatment must become standard practice in India's urban and industrial sectors.\" Analyze this statement by examining the benefits and methods of recycling non-potable wastewater. [5 Marks]", "answer": "Analysis: Growing urban-industrial water demand; Wastewater treatment methods (Secondary/tertiary sewage treatment, industrial effluent treatment plants); Reuse applications (Flushing, garden irrigation, cooling towers in power plants, car washing); Benefits (Relieving pressure on fresh drinking aquifers, environmental protection).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks urban-industrial demand crisis + 2 Marks recycling methods & reuse applications + 1.5 Marks environmental benefits):\n\u2022 1. Urban-Industrial Water Stress [1.5 Marks]:\n  - Urbanization and manufacturing growth drive competing demands for limited freshwater, making untreated disposal unsustainable.\n\u2022 2. Recycling Technologies & Practical Reuse [2 Marks]:\n  - Effluent Treatment Plants (ETPs) and Sewage Treatment Plants (STPs) treat wastewater to non-potable standards.\n  - Reclaimed water can be used for toilet flushing, public park maintenance, construction mixing, and industrial cooling towers.\n\u2022 3. Environmental Benefits [1.5 Marks]:\n  - Conserves high-quality freshwater for municipal drinking supplies while reducing untreated effluent discharges into natural rivers."}, {"id": 49, "type": "LA", "tag": "CBSE 2018", "question": "Compare the water resource dynamics of North Indian Himalayan rivers with South Indian Peninsular rivers. How do differences in flow regimes influence irrigation and hydro-electric potential? [5 Marks]", "answer": "Comparative study: Himalayan rivers (Perennial, snow-melt + monsoon, large catchment, high surface flow, Ganga/Brahmaputra/Indus, silt load, huge untapped potential); Peninsular rivers (Seasonal, monsoon-dependent, rocky beds, high utilization, Godavari/Krishna/Cauvery); Implications for irrigation and dams.", "explanation": "Step-by-Step Marking Scheme (2.5 Marks Himalayan rivers profile + 2.5 Marks Peninsular rivers profile):\n\u2022 1. Himalayan River Dynamics [2.5 Marks]:\n  - Flow Regime: Perennial, fed by both Himalayan snowmelt in summer and monsoon rainfall in autumn.\n  - Volume & Topography: Large drainage basins with heavy discharge, carrying substantial alluvial silt; steep gorges provide high hydroelectric potential.\n\u2022 2. Peninsular River Dynamics [2.5 Marks]:\n  - Flow Regime: Seasonal, dependent entirely on monsoon rainfall; flow drops significantly during dry winter and summer months.\n  - Volume & Topography: Graded profiles over hard, impermeable rock beds with limited silt, suited for reservoir storage and high-utilization canal networks (e.g. Godavari, Krishna, Cauvery)."}, {"id": 50, "type": "LA", "tag": "CBSE 2017", "question": "\"Effective water governance requires shifting from a supply-side infrastructure paradigm to a demand-side conservation paradigm.\" Evaluate this statement in the context of contemporary Indian water challenges. [5 Marks]", "answer": "Evaluation: Supply-side paradigm (Building more mega dams, canals, tube-wells; nearing ecological limits); Demand-side paradigm (Water conservation, micro-irrigation like drip/sprinkler, crop diversification away from thirsty crops in dry areas, water audits, rainwater harvesting); Policy imperative for long-term sustainability.", "explanation": "Step-by-Step Marking Scheme (2 Marks critique of supply-side approach + 2 Marks demand-side interventions + 1 Mark policy roadmap):\n\u2022 1. Limitations of the Supply-Side Paradigm [2 Marks]:\n  - Historically focused on large dam construction and extensive canal networks, which face rising financial costs, ecological disruption, and reservoir siltation.\n\u2022 2. Interventions in Demand-Side Management [2 Marks]:\n  - Promotes micro-irrigation (drip and sprinkler systems), reducing agricultural water consumption by up to 50%.\n  - Encourages shifting away from water-intensive crops (like paddy and sugarcane) in water-scarce regions like Punjab and Maharashtra toward pulses and millets.\n\u2022 3. Policy Roadmap [1 Mark]:\n  - Highlights the need to integrate mandatory rainwater harvesting, tiered volumetric water pricing, and community-led watershed governance to ensure sustainable water use."}]}, {"info": {"chapter_num": 13, "book": "India: People and Economy", "title": "Mineral and Energy Resources", "author": "NCERT Class 12 Geography (029)", "weightage_unit": "Book 2 - Unit III: Resources & Development - Minerals & Energy (5 Marks)"}, "questions": [{"id": 1, "type": "MCQ", "tag": "CBSE 2024", "question": "Which of the following is the OLDEST oil-producing region in India, where commercial petroleum drilling commenced as early as 1889?", "options": ["(a) Digboi in Assam", "(b) Ankleshwar in Gujarat", "(c) Mumbai High", "(d) Barmer in Rajasthan"], "answer": "(a) Digboi in Assam", "explanation": "Digboi in Assam is the oldest operating oilfield in India, where commercial oil exploration began in 1889."}, {"id": 2, "type": "MCQ", "tag": "CBSE 2024", "question": "Which state is the LARGEST producer of Bauxite (ore of aluminum) in India, with major deposits located in the Panchpatmali hills of Koraput district?", "options": ["(a) Odisha", "(b) Jharkhand", "(c) Gujarat", "(d) Chhattisgarh"], "answer": "(a) Odisha", "explanation": "Odisha is the leading bauxite producer in India, with deposits concentrated in the Panchpatmali plateau in Koraput, as well as Kalahandi and Bolangir."}, {"id": 3, "type": "MCQ", "tag": "CBSE 2023", "question": "The famous 'Bailadila' iron ore mines, known for high-grade haematite deposits that are exported to Japan through Visakhapatnam port, are located in:", "options": ["(a) Bastar district of Chhattisgarh", "(b) Mayurbhanj district of Odisha", "(c) Chikmagalur district of Karnataka", "(d) Singhbhum district of Jharkhand"], "answer": "(a) Bastar district of Chhattisgarh", "explanation": "The Bailadila range in Bastar, Chhattisgarh, contains high-grade haematite ore exported to Japan and South Korea via Visakhapatnam port."}, {"id": 4, "type": "MCQ", "tag": "CBSE 2023", "question": "Which of the following mineral belts is commonly referred to as the 'Mineral Heartland of India', containing rich reserves of coal, iron ore, manganese, and mica?", "options": ["(a) The North-Eastern Plateau Region (Chota Nagpur)", "(b) The South-Western Plateau Region", "(c) The North-Western Region", "(d) The Himalayan Belt"], "answer": "(a) The North-Eastern Plateau Region (Chota Nagpur)", "explanation": "The North-Eastern Plateau (Chota Nagpur, Odisha, and West Bengal) holds significant reserves of coal, iron ore, and manganese, serving as India's primary mineral belt."}, {"id": 5, "type": "MCQ", "tag": "CBSE 2022 Term-1", "question": "Gondwana coal, which accounts for about 98 percent of India's total coal reserves, is primarily located in which river valley?", "options": ["(a) Damodar Valley (Jharkhand and West Bengal)", "(b) Brahmaputra Valley", "(c) Indus Valley", "(d) Narmada Valley"], "answer": "(a) Damodar Valley (Jharkhand and West Bengal)", "explanation": "The Damodar Valley (Jharia, Raniganj, Bokaro) contains the majority of India's metallurgical coking coal within the Gondwana geological formation."}, {"id": 6, "type": "MCQ", "tag": "CBSE 2022 Term-1", "question": "Which state has the largest deposit of 'Lignite' (brown coal) in India, mined extensively at Neyveli for thermal power generation?", "options": ["(a) Tamil Nadu", "(b) Jharkhand", "(c) Odisha", "(d) West Bengal"], "answer": "(a) Tamil Nadu", "explanation": "Neyveli in the Cuddalore district of Tamil Nadu contains India's largest deposits of lignite, utilized for local thermal power generation."}, {"id": 7, "type": "MCQ", "tag": "CBSE 2021", "question": "Thorium, an essential nuclear fuel mineral, is extracted from 'Monazite' beach sands found abundantly along the coast of:", "options": ["(a) Kerala", "(b) Gujarat", "(c) Maharashtra", "(d) West Bengal"], "answer": "(a) Kerala", "explanation": "Monazite beach sands along the coast of Kerala (particularly in Kollam and Palakkad districts) contain significant thorium reserves."}, {"id": 8, "type": "MCQ", "tag": "CBSE 2020 Delhi", "question": "Which of the following is the premier nuclear power station located in Uttar Pradesh?", "options": ["(a) Narora", "(b) Tarapur", "(c) Rawatbhata", "(d) Kalpakkam"], "answer": "(a) Narora", "explanation": "Narora Atomic Power Station is located in Bulandshahr district, Uttar Pradesh; Tarapur is in Maharashtra, Rawatbhata in Rajasthan, and Kalpakkam in Tamil Nadu."}, {"id": 9, "type": "MCQ", "tag": "CBSE 2020 AI", "question": "The Khetri copper belt, famous since antiquity for underground copper mining, is situated in which district of Rajasthan?", "options": ["(a) Jhunjhunu", "(b) Bikaner", "(c) Jaisalmer", "(d) Udaipur"], "answer": "(a) Jhunjhunu", "explanation": "The Khetri copper belt is located in the Jhunjhunu district of Rajasthan, managed by Hindustan Copper Limited."}, {"id": 10, "type": "MCQ", "tag": "CBSE 2019", "question": "Mumbai High, India's largest offshore crude oilfield discovered in 1973, is located in the Arabian Sea approximately how many kilometers off the coast of Mumbai?", "options": ["(a) 160 km", "(b) 10 km", "(c) 500 km", "(d) 1,000 km"], "answer": "(a) 160 km", "explanation": "Mumbai High is an offshore oilfield located on the continental shelf roughly 160 km west-northwest of Mumbai, operated by ONGC using the Sagar Samrat drilling platform."}, {"id": 11, "type": "MCQ", "tag": "CBSE 2019", "question": "Which district in Jharkhand is internationally renowned as the 'Mica Capital of the World'?", "options": ["(a) Koderma", "(b) Ranchi", "(c) Dhanbad", "(d) Jamshedpur"], "answer": "(a) Koderma", "explanation": "Koderma in Jharkhand is known for producing high-grade ruby mica sheets, earning it the title 'Mica Capital of the World'."}, {"id": 12, "type": "MCQ", "tag": "CBSE 2018", "question": "The 1,750-kilometer-long cross-country HVJ natural gas pipeline connects Hazira in Gujarat to:", "options": ["(a) Vijaipur in Madhya Pradesh and Jagdishpur in Uttar Pradesh", "(b) Kolkata in West Bengal", "(c) Chennai in Tamil Nadu", "(d) Srinagar in Jammu and Kashmir"], "answer": "(a) Vijaipur in Madhya Pradesh and Jagdishpur in Uttar Pradesh", "explanation": "Constructed by GAIL, the Hazira-Vijaipur-Jagdishpur (HVJ) pipeline supplies offshore gas from the western coast to fertilizer, power, and industrial plants across northern India."}, {"id": 13, "type": "MCQ", "tag": "CBSE 2018", "question": "Which non-ferrous metallic mineral is prized for its high malleability, ductility, and electrical conductivity, making it essential for the electrical engineering industry?", "options": ["(a) Copper", "(b) Limestone", "(c) Iron ore", "(d) Coal"], "answer": "(a) Copper", "explanation": "Copper's electrical and thermal conductivity, combined with malleability and ductility, makes it an essential material for wiring, electric motors, and generators."}, {"id": 14, "type": "MCQ", "tag": "CBSE 2017", "question": "Where is the largest operational wind farm cluster in India located, spanning across the Muppandal and Perungudi regions?", "options": ["(a) Tamil Nadu (from Kanyakumari to Tirunelveli)", "(b) Thar Desert of Rajasthan", "(c) Coastal Odisha", "(d) Leh in Ladakh"], "answer": "(a) Tamil Nadu (from Kanyakumari to Tirunelveli)", "explanation": "The Muppandal wind farm cluster in southern Tamil Nadu utilizes seasonal monsoon winds passing through mountain gaps, forming one of the largest onshore wind installations globally."}, {"id": 15, "type": "MCQ", "tag": "CBSE 2017", "question": "Uranium deposits in India are mined extensively from the Dharwar metamorphic formations at Jaduguda in which state?", "options": ["(a) Jharkhand (Singhbhum district)", "(b) Kerala", "(c) Punjab", "(d) Assam"], "answer": "(a) Jharkhand (Singhbhum district)", "explanation": "Jaduguda in the East Singhbhum district of Jharkhand contains India's primary commercial uranium deposits, operated by the Uranium Corporation of India (UCIL)."}, {"id": 16, "type": "MCQ", "tag": "CBSE 2016", "question": "Which of the following is an experimental pilot plant established to harness 'Geothermal Energy' in India?", "options": ["(a) Manikaran in Parvati Valley (Himachal Pradesh) and Puga Valley in Ladakh", "(b) Mumbai High offshore platform", "(c) Digboi oil refinery", "(d) Jharia coal pit"], "answer": "(a) Manikaran in Parvati Valley (Himachal Pradesh) and Puga Valley in Ladakh", "explanation": "Pilot geothermal energy projects tap underground hot water springs at Manikaran in Himachal Pradesh and the Puga Valley in Ladakh."}, {"id": 17, "type": "MCQ", "tag": "CBSE 2016", "question": "Manganese is an essential mineral input utilized primarily for:", "options": ["(a) Smelting iron ore and manufacturing ferro-manganese steel alloys", "(b) Manufacturing aircraft wings", "(c) Making solar panels", "(d) Refining sugarcane juice"], "answer": "(a) Smelting iron ore and manufacturing ferro-manganese steel alloys", "explanation": "Manganese acts as a deoxidizer and alloying agent; roughly 10 kg of manganese is required to manufacture one ton of steel."}, {"id": 18, "type": "MCQ", "tag": "CBSE 2015", "question": "Which mineral exhibits superior dielectric strength, low power loss factor, and resistance to high voltages, making it an indispensable insulator in the electrical and electronic industries?", "options": ["(a) Mica", "(b) Bauxite", "(c) Copper", "(d) Iron ore"], "answer": "(a) Mica", "explanation": "Mica can be split into thin, flexible, heat-resistant sheets with high insulating capacity, making it a valuable material for electrical appliances and electronic capacitors."}, {"id": 19, "type": "MCQ", "tag": "CBSE 2024", "question": "The Kudremukh iron ore deposits in Karnataka, once developed as a 100% export-oriented unit, transported iron ore in slurry form via a pipeline to which port?", "options": ["(a) Mangalore", "(b) Mormugao", "(c) Kochi", "(d) Chennai"], "answer": "(a) Mangalore", "explanation": "Iron ore from the Kudremukh deposits was crushed into slurry and transported via a 110-km pipeline through the Western Ghats to Mangalore port for maritime export."}, {"id": 20, "type": "MCQ", "tag": "CBSE 2023", "question": "Tertiary coal deposits in India, characterized by high sulfur and moisture content, are located in which geographic belt?", "options": ["(a) North-Eastern states (Assam, Meghalaya, Arunachal Pradesh, Nagaland)", "(b) Damodar Valley", "(c) Mahanadi Valley", "(d) Godavari Basin"], "answer": "(a) North-Eastern states (Assam, Meghalaya, Arunachal Pradesh, Nagaland)", "explanation": "Tertiary coal is a younger geological formation (roughly 55 million years old) found in the North-Eastern hill states, containing higher sulfur and volatile matter."}, {"id": 21, "type": "MCQ", "tag": "CBSE 2022", "question": "Which of the following is a non-conventional, renewable source of energy that converts municipal biological and agricultural waste into clean energy?", "options": ["(a) Bio-energy", "(b) Thermal coal energy", "(c) Diesel generator", "(d) Lignite power"], "answer": "(a) Bio-energy", "explanation": "Bio-energy processes biological waste, cattle manure, and municipal solid garbage into biogas and electricity (e.g. the waste-to-energy plant in Okhla, New Delhi)."}, {"id": 22, "type": "MCQ", "tag": "CBSE 2021", "question": "The Tarapur Atomic Power Station, the first commercial nuclear power facility commissioned in India (1969), is situated in:", "options": ["(a) Maharashtra", "(b) Tamil Nadu", "(c) Gujarat", "(d) Rajasthan"], "answer": "(a) Maharashtra", "explanation": "The Tarapur Atomic Power Station in Palghar district, Maharashtra, was commissioned in October 1969 as India's first commercial nuclear power reactor."}, {"id": 23, "type": "MCQ", "tag": "CBSE 2020", "question": "Which of the following is a prominent coastal iron ore exporting port located in Goa?", "options": ["(a) Mormugao", "(b) Paradip", "(c) Tuticorin", "(d) Kandla"], "answer": "(a) Mormugao", "explanation": "Mormugao port in Goa handles bulk iron ore exports mined from the Goa and southern Maharashtra iron ore belt."}, {"id": 24, "type": "MCQ", "tag": "CBSE 2019", "question": "Gas Authority of India Limited (GAIL) was set up in which year as a public sector undertaking to transport, process, and market natural gas across India?", "options": ["(a) 1984", "(b) 1956", "(c) 1991", "(d) 2001"], "answer": "(a) 1984", "explanation": "GAIL was established in August 1984 to manage the transmission, distribution, and commercial processing of natural gas across the country."}, {"id": 25, "type": "MCQ", "tag": "CBSE 2018", "question": "Which Indian state has the largest potential for generating solar energy due to abundant cloud-free sunny days throughout the year?", "options": ["(a) Rajasthan", "(b) Assam", "(c) Himachal Pradesh", "(d) Kerala"], "answer": "(a) Rajasthan", "explanation": "With dry desert conditions and high annual solar insolation, Rajasthan holds significant solar energy potential, hosting installations like the Bhadla Solar Park."}, {"id": 26, "type": "AR", "tag": "CBSE 2024", "question": "Assertion (A): Mineral resources are finite, exhaustible, and non-renewable natural assets.\nReason (R): Geological processes of mineral formation, concentration, and crystallization require millions of years, while rates of modern industrial consumption are rapid.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true and (R) explains (A). The time required for geological mineral formation makes mineral extraction an exhaustible process."}, {"id": 27, "type": "AR", "tag": "CBSE 2023", "question": "Assertion (A): India possesses vast reserves of high-grade metallurgical coking coal required for iron and steel smelting.\nReason (R): More than 98% of Indian coal consists of high-grade anthracite coal with zero ash and zero sulfur content.", "options": ["(a) Both (A) and (R) are true", "(b) Both (A) and (R) are false", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(b) Both (A) and (R) are false", "explanation": "Both statements are false: India has limited reserves of prime metallurgical coking coal and imports coking coal from Australia; most domestic coal is bituminous with high ash content."}, {"id": 28, "type": "AR", "tag": "CBSE 2022", "question": "Assertion (A): Non-conventional energy sources like solar, wind, and bio-energy must be rapidly expanded in India's energy mix.\nReason (R): Non-conventional energy sources are renewable, environmentally clean, produce no greenhouse carbon emissions, and promote sustainable decentralized power.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true and (R) explains (A). Renewable energy sources reduce reliance on imported fossil fuels while mitigating carbon emissions."}, {"id": 29, "type": "AR", "tag": "CBSE 2021", "question": "Assertion (A): The export demand for Indian sheet mica has declined noticeably in recent decades.\nReason (R): Synthetic plastic polymers and artificial dielectric insulating materials have replaced natural mica in many electrical and electronics applications.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true. The development of synthetic electrical insulators and ceramic polymers has reduced industrial demand for natural sheet mica."}, {"id": 30, "type": "AR", "tag": "CBSE 2020", "question": "Assertion (A): Monazite sands in Kerala are dredged to extract copper and aluminum for electrical house wiring.\nReason (R): Monazite is the primary geological ore from which pure gold is refined across the Malabar coastline.", "options": ["(a) Both (A) and (R) are true", "(b) Both (A) and (R) are false", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(b) Both (A) and (R) are false", "explanation": "Both are false: Monazite beach sands contain thorium and rare earth elements used in nuclear energy, not copper, aluminum, or gold."}, {"id": 31, "type": "SA", "tag": "CBSE 2024", "question": "Differentiate between 'Ferrous' and 'Non-Ferrous' metallic minerals with two examples of each. [3 Marks]", "answer": "Ferrous: Contain iron (Iron ore, Manganese, Chromite); Non-Ferrous: Do not contain iron (Copper, Bauxite, Lead, Zinc).", "explanation": "Marking Scheme (1.5 Marks Ferrous + 1.5 Marks Non-Ferrous):\n\u2022 Ferrous Metallic Minerals:\n  - Definition: Metallic minerals that contain iron as a primary chemical component.\n  - Examples: Iron ore, Manganese, Chromite, and Nickel; essential for manufacturing steel alloys.\n\u2022 Non-Ferrous Metallic Minerals:\n  - Definition: Metallic minerals that do not contain iron.\n  - Examples: Copper, Bauxite (aluminum ore), Lead, Zinc, and Gold; valued for electrical conductivity, corrosion resistance, and malleability."}, {"id": 32, "type": "SA", "tag": "CBSE 2024", "question": "Explain the significance of 'Non-Conventional Energy Sources' for India's sustainable development. [3 Marks]", "answer": "Renewable and inexhaustible; environmentally clean (zero greenhouse emissions); reduces fossil fuel import dependence; provides decentralized rural power.", "explanation": "Marking Scheme (1 Mark for each major argument):\n\u2022 1. Inexhaustible & Renewable: Solar, wind, and biomass energy rely on continuous natural processes and do not face resource depletion like coal or oil.\n\u2022 2. Environmental Protection: Generates electricity without greenhouse gas emissions, sulfur dioxide, or fly ash pollution.\n\u2022 3. Decentralized Energy Security: Off-grid solar and bio-energy systems provide power to remote rural and tribal settlements, reducing fossil fuel imports."}, {"id": 33, "type": "SA", "tag": "CBSE 2023", "question": "Describe the three major mineral belts of India. [3 Marks]", "answer": "1. North-Eastern Plateau (Chota Nagpur: coal, iron, mica); 2. South-Western Plateau (Karnataka/Goa: iron, bauxite); 3. North-Western Region (Rajasthan/Gujarat: copper, zinc, petroleum).", "explanation": "Marking Scheme (1 Mark for each mineral belt):\n\u2022 1. North-Eastern Plateau Region: Covers Chota Nagpur (Jharkhand), Odisha, and West Bengal; contains significant reserves of iron ore, metallurgical coal, manganese, bauxite, and mica.\n\u2022 2. South-Western Plateau Region: Extends over Karnataka, Goa, and upland Tamil Nadu/Kerala; rich in iron ore, manganese, and bauxite, with monazite beach sands in Kerala.\n\u2022 3. North-Western Region: Extends along the Aravallis in Rajasthan and Gujarat; rich in non-ferrous minerals (copper, zinc, lead), building stones, and petroleum (Ankleshwar, Barmer)."}, {"id": 34, "type": "SA", "tag": "CBSE 2023", "question": "Differentiate between 'Gondwana Coal' and 'Tertiary Coal' in India. [3 Marks]", "answer": "Gondwana: 200 million years old, 98% of reserves, metallurgical coking coal, Damodar valley; Tertiary: 55 million years old, high sulfur/moisture, North-East hill states.", "explanation": "Marking Scheme (1.5 Marks Gondwana + 1.5 Marks Tertiary):\n\u2022 Gondwana Coal:\n  - Age & Share: Approximately 200 million years old; accounts for roughly 98% of India's coal reserves and nearly all metallurgical coking coal.\n  - Location: Concentrated in river valleys: Damodar (Jharia, Raniganj), Son, Mahanadi, and Godavari.\n\u2022 Tertiary Coal:\n  - Age & Quality: Younger geological formation (~55 million years old); has higher sulfur, volatile matter, and moisture content.\n  - Location: Found in the North-Eastern states (Assam, Meghalaya, Arunachal Pradesh) and as lignite in Neyveli, Tamil Nadu."}, {"id": 35, "type": "SA", "tag": "CBSE 2022", "question": "Explain the distribution and economic importance of 'Bauxite' in India. Name two leading producer states. [3 Marks]", "answer": "Ore of aluminum; light, strong, conductive; found in tertiary laterite rocks; Leading states: Odisha (Panchpatmali), Gujarat.", "explanation": "Marking Scheme (1 Mark economic importance + 1 Mark geological occurrence + 1 Mark leading states):\n\u2022 Economic Importance: The primary ore of aluminum, valued in aviation, electrical manufacturing, and transport for its high strength-to-weight ratio and conductivity.\n\u2022 Geological Occurrence: Formed by the surface weathering of aluminum-rich rocks under tropical conditions, found in tertiary laterite capping plateaus.\n\u2022 Leading Producer States: Odisha leads national production (Panchpatmali in Koraput), followed by Gujarat (Bhavnagar, Jamnagar) and Jharkhand."}, {"id": 36, "type": "SA", "tag": "CBSE 2022", "question": "What is 'Nuclear Energy'? Name any two minerals utilized for generating nuclear power in India with their locations. [3 Marks]", "answer": "Energy generated by nuclear fission of radioactive elements; Minerals: 1. Uranium (Jaduguda in Jharkhand); 2. Thorium (Monazite beach sands in Kerala).", "explanation": "Marking Scheme (1 Mark definition + 2 Marks minerals and locations):\n\u2022 Definition: Electrical energy generated through controlled nuclear fission of heavy radioactive isotopes in atomic reactors.\n\u2022 Key Minerals & Locations:\n  1. Uranium: Sourced from Dharwar metamorphic formations at Jaduguda in East Singhbhum district, Jharkhand.\n  2. Thorium: Extracted from monazite beach placer deposits along the coast of Kerala and parts of Tamil Nadu and Odisha."}, {"id": 37, "type": "SA", "tag": "CBSE 2020", "question": "Why is 'Mica' an essential mineral in the electrical and electronic industries? Why has its export demand declined? [3 Marks]", "answer": "High dielectric strength, insulating, withstands high voltage; Export declined due to synthetic plastic/polymer substitutes.", "explanation": "Marking Scheme (1.5 Marks industrial utility + 1.5 Marks reason for export decline):\n\u2022 Industrial Utility: Excellent dielectric strength, low power loss factor, and heat resistance make it a reliable electrical insulator for capacitors, motors, and high-voltage gear.\n\u2022 Export Decline: Global demand has dropped as synthetic polymers, plastics, and ceramic materials have replaced natural mica in many electronic applications."}, {"id": 38, "type": "SA", "tag": "CBSE 2019", "question": "State any three measures necessary for the 'Conservation of Mineral Resources' in India. [3 Marks]", "answer": "1. Recycling of scrap metals; 2. Using renewable and synthetic substitutes; 3. Efficient extraction and beneficiation technologies.", "explanation": "Marking Scheme (1 Mark for each conservation measure):\n\u2022 1. Scrap Metal Recycling: Recycling scrap iron, copper, and aluminum reduces the need for primary ore extraction and lowers energy consumption.\n\u2022 2. Alternative Substitutes: Replacing scarce minerals with abundant materials, such as using plastics or glass fibers in place of metals.\n\u2022 3. Improved Extraction & Beneficiation: Adopting modern mining and beneficiation technologies to process lower-grade ores and reduce waste during extraction."}, {"id": 39, "type": "SA", "tag": "CBSE 2018", "question": "Describe the economic significance of 'Petroleum' in India. Name two onshore and one offshore oilfield. [3 Marks]", "answer": "Liquid gold; transport fuel, petrochemical raw material; Onshore: Digboi (Assam), Ankleshwar (Gujarat); Offshore: Mumbai High.", "explanation": "Marking Scheme (1.5 Marks economic role + 1.5 Marks oilfield examples):\n\u2022 Economic Role: Serves as a primary transport fuel and energy source, providing raw material inputs for synthetic fibers, fertilizers, plastics, and pharmaceuticals.\n\u2022 Oilfield Examples:\n  - Onshore: Digboi (Assam) and Ankleshwar (Gujarat).\n  - Offshore: Mumbai High, located 160 km off the western coast in the Arabian Sea."}, {"id": 40, "type": "SA", "tag": "CBSE 2017", "question": "What is 'Bio-energy'? Explain its dual advantage for rural India. [3 Marks]", "answer": "Energy generated from biological waste (cattle dung, crop residue, garbage); Dual advantage: Clean energy supply + Organic manure production.", "explanation": "Marking Scheme (1 Mark definition + 2 Marks dual advantages):\n\u2022 Definition: Clean energy harnessed by converting biological waste, animal manure, crop residues, and municipal garbage into gas or electricity.\n\u2022 Dual Advantages for Rural Areas:\n  1. Provides clean, smoke-free domestic cooking fuel and decentralized power, reducing reliance on firewood.\n  2. Yields nutrient-rich organic bio-slurry as a by-product, which serves as a natural fertilizer for farming soils."}, {"id": 41, "type": "LA", "tag": "CBSE 2024", "question": "Examine the geographic distribution, ore varieties, and major mining belts of 'Iron Ore' in India. Detail the Odisha-Jharkhand belt, Durg-Bastar-Chandrapur belt, and Ballari-Chitradurga-Chikkamagaluru-Tumakuru belt. [5 Marks]", "answer": "Comprehensive examination: India's iron ore endowments (Haematite and Magnetite); Detailed examination of: (1) Odisha-Jharkhand Belt (Badampahar, Kendujhar, Noamundi, Gua); (2) Durg-Bastar-Chandrapur Belt (Bailadila mines, export to Japan via Visakhapatnam); (3) Ballari-Chitradurga-Chikkamagaluru-Tumakuru Belt (Kudremukh slurry pipeline, Mangalore); (4) Maharashtra-Goa Belt.", "explanation": "Step-by-Step Marking Scheme (1 Mark ore varieties + 1.25 Marks each for three primary belts + 0.25 Mark export ports):\n\u2022 1. Iron Ore Varieties & National Endowments [1 Mark]:\n  - India has significant iron ore reserves, predominantly high-grade Haematite (60%\u201370% iron) and Magnetite (high magnetic properties).\n\u2022 2. Odisha-Jharkhand Belt [1.25 Marks]:\n  - High-grade haematite is mined at Badampahar in Mayurbhanj, Kendujhar, and Bonai in Odisha, extending into Noamundi and Gua in West Singhbhum, Jharkhand.\n\u2022 3. Durg-Bastar-Chandrapur Belt [1.25 Marks]:\n  - Contains the Bailadila range in Bastar, Chhattisgarh, producing high-grade haematite with low impurities, exported to Japan and South Korea via Visakhapatnam.\n\u2022 4. Ballari-Chitradurga-Chikkamagaluru-Tumakuru Belt (Karnataka) [1.25 Marks]:\n  - Includes the Kudremukh deposits; iron ore was historically crushed into slurry and moved via pipeline to Mangalore port for export.\n\u2022 5. Maharashtra-Goa Belt [0.25 Mark]:\n  - Lower-grade ores are mined and exported via Mormugao port."}, {"id": 42, "type": "LA", "tag": "CBSE 2024", "question": "Discuss 'Coal' as the primary fossil fuel of India's commercial energy sector. Compare the geological characteristics, reserves, quality, and spatial distribution of Gondwana Coalfields with Tertiary Coalfields. [5 Marks]", "answer": "Detailed comparative analysis: Energy backbone (80% power generation); Gondwana coalfields (98% reserves, Damodar valley: Jharia, Raniganj, Bokaro; Son, Mahanadi, Godavari; Bituminous coking coal); Tertiary coalfields (Assam: Makum; Meghalaya: Cherrapunji; Neyveli lignite; High sulfur/moisture); Coal conservation and beneficiation.", "explanation": "Step-by-Step Marking Scheme (1 Mark economic role + 2 Marks Gondwana coalfields + 2 Marks Tertiary coalfields):\n\u2022 1. Economic Role of Coal [1 Mark]:\n  - The backbone of India's commercial energy, supplying over 70% of electricity via thermal power plants and acting as an essential reductant in blast furnaces.\n\u2022 2. Gondwana Coalfields (200 Million Years Old) [2 Marks]:\n  - Accounts for roughly 98% of total coal reserves and nearly all prime metallurgical coking coal.\n  - Concentrated in river valleys: Damodar (Jharia, Raniganj, Bokaro), Son, Mahanadi (Talcher), and Godavari (Singareni).\n  - Characteristics: Primarily bituminous, medium-to-low sulfur, but carries relatively high ash content (25%\u201340%).\n\u2022 3. Tertiary Coalfields (55 Million Years Old) [2 Marks]:\n  - Formed in the younger Tertiary geological era; carries higher moisture and sulfur content, limiting suitability for steelmaking.\n  - Located in the North-Eastern states (Makum in Assam, Cherrapunji in Meghalaya, Namchik-Namphuk in Arunachal Pradesh), along with lignite (brown coal) at Neyveli in Tamil Nadu."}, {"id": 43, "type": "LA", "tag": "CBSE 2023", "question": "Examine the geographic distribution of 'Petroleum' and 'Natural Gas' in India. Detail the Western Offshore (Mumbai High), Western Onshore (Gujarat/Rajasthan), and Eastern Onshore/Offshore (Assam, Krishna-Godavari Basin) oilfields. [5 Marks]", "answer": "Comprehensive examination: Petroleum and natural gas distribution; (1) Western Offshore (Mumbai High, Bassein, Sagar Samrat platform); (2) Western Onshore (Gujarat: Ankleshwar, Kalol, Nawagam; Rajasthan: Barmer basin, Mangala); (3) Eastern Belt (Assam: Digboi, Naharkatiya, Moran); (4) KG Basin and cross-country gas pipelines (GAIL, HVJ line).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks Western Offshore + 1.5 Marks Western Onshore + 1 Mark Eastern Belt + 1 Mark Natural Gas & Pipelines):\n\u2022 1. Western Offshore Oilfields [1.5 Marks]:\n  - Mumbai High: Located on the continental shelf roughly 160 km off Mumbai, discovered in 1973; drilled using the Sagar Samrat jack-up platform, contributing a substantial share of domestic crude.\n  - Bassein oil and natural gas fields lie south of Mumbai High.\n\u2022 2. Western Onshore Belt [1.5 Marks]:\n  - Gujarat: Oil deposits in the Cambay basin, including Ankleshwar, Kalol, Nawagam, and Mehsana.\n  - Rajasthan: Major discoveries in the Barmer basin (Mangala, Bhagyam, Aishwarya fields).\n\u2022 3. Eastern Belt (Assam) [1 Mark]:\n  - The oldest oil province; includes Digboi, Naharkatiya, and Moran-Hugrijan in the Brahmaputra Valley.\n\u2022 4. Natural Gas & Infrastructure (KG Basin & HVJ) [1 Mark]:\n  - Offshore natural gas deposits in the Krishna-Godavari (KG-D6) and Cauvery basins.\n  - GAIL's 1,750-km Hazira-Vijaipur-Jagdishpur (HVJ) pipeline supplies offshore gas to inland fertilizer and thermal power plants."}, {"id": 44, "type": "LA", "tag": "CBSE 2023", "question": "Analyze the potential, spatial distribution, and progress of 'Non-Conventional Energy Sources' in India: (a) Solar Energy, (b) Wind Energy, (c) Tidal/Wave Energy, and (d) Geothermal Energy. [5 Marks]", "answer": "Detailed examination: Need for renewable transition; (1) Solar Energy (Photovoltaic, high potential in western deserts, Bhadla Solar Park in Rajasthan); (2) Wind Energy (Muppandal in Tamil Nadu, Gujarat coast, wind corridors); (3) Tidal Energy (Gulf of Kachchh, Sundarbans); (4) Geothermal Energy (Manikaran, Puga Valley); Environmental benefits.", "explanation": "Step-by-Step Marking Scheme (1.25 Marks each for Solar, Wind, Tidal, and Geothermal energy):\n\u2022 1. Solar Energy [1.25 Marks]:\n  - High solar insolation (roughly 300 sunny days annually), especially in Rajasthan and Gujarat.\n  - Projects like the Bhadla Solar Park convert sunlight into electricity using photovoltaic cells, providing clean power for the national grid.\n\u2022 2. Wind Energy [1.25 Marks]:\n  - High wind potential along coastal belts and mountain gaps; Tamil Nadu hosts a major wind cluster from Muppandal to Tirunelveli, supplemented by farms in Gujarat and Maharashtra.\n\u2022 3. Tidal & Wave Energy [1.25 Marks]:\n  - Utilizes tidal ranges in oceanic gulfs; prime potential in the Gulf of Kachchh and Gulf of Khambhat in Gujarat, along with the Sundarbans delta in West Bengal.\n\u2022 4. Geothermal Energy [1.25 Marks]:\n  - Harnesses heat from underground hot water springs; experimental pilot plants operate at Manikaran in Himachal Pradesh and Puga Valley in Ladakh."}, {"id": 45, "type": "LA", "tag": "CBSE 2022", "question": "Examine the geographic distribution and industrial significance of 'Nuclear Energy' in India. Identify the primary minerals (Uranium and Thorium), their mining locations, and detail the four prominent nuclear power stations. [5 Marks]", "answer": "Detailed examination: Nuclear fuel base: Uranium (Dharwar rocks, Jaduguda in Singhbhum, Jharkhand) and Thorium (Monazite beach sands of Kerala, Palakkad/Kollam); Nuclear power stations: Tarapur (Maharashtra), Rawatbhata (Rajasthan), Kalpakkam (Tamil Nadu), Narora (UP), Kaiga (Karnataka); Strategic energy role.", "explanation": "Step-by-Step Marking Scheme (2 Marks nuclear minerals & locations + 2 Marks prominent power stations + 1 Mark strategic importance):\n\u2022 1. Nuclear Minerals & Mining Locations [2 Marks]:\n  - Uranium: Found in Dharwar metamorphic rocks, mined at Jaduguda, Narwapahar, and Bhatin in East Singhbhum, Jharkhand.\n  - Thorium: Sourced from monazite beach placer sands along the coast of Kerala, as well as coastal Odisha and Tamil Nadu.\n\u2022 2. Major Nuclear Power Stations [2 Marks]:\n  - Tarapur: India's first commercial atomic plant, located in Maharashtra.\n  - Rawatbhata: Near Kota in Rajasthan, utilizing pressurized heavy water reactors.\n  - Kalpakkam (Madras Atomic Power Station): In Tamil Nadu, supporting fast breeder reactor research.\n  - Narora: Situated along the Ganga in Bulandshahr district, Uttar Pradesh.\n\u2022 3. Strategic Importance [1 Mark]:\n  - Supplies baseload electricity without greenhouse emissions, reducing reliance on coal and oil."}, {"id": 46, "type": "LA", "tag": "CBSE 2021", "question": "\"Mineral resources are unevenly distributed across India, reflecting underlying geological formations.\" Justify this statement by analyzing the three major mineral belts and their economic contributions. [5 Marks]", "answer": "Justification: Geological concentration; (1) North-Eastern Plateau (Chota Nagpur: Coal, iron ore, manganese, bauxite, mica, heavy industry base); (2) South-Western Plateau (Karnataka/Goa/TN: Iron ore, bauxite, manganese, beach sands); (3) North-Western Belt (Aravallis/Gujarat: Copper, zinc, marble, sandstone, petroleum in Cambay/Barmer); Economic contributions to national GDP.", "explanation": "Step-by-Step Marking Scheme (1.5 Marks North-Eastern Belt + 1.5 Marks South-Western Belt + 1.5 Marks North-Western Belt + 0.5 Mark geological synthesis):\n\u2022 1. North-Eastern Plateau Belt [1.5 Marks]:\n  - Formed of ancient Gondwana and Dharwar rocks across Chota Nagpur, Odisha, and West Bengal; rich in coking coal, iron ore, manganese, and mica, supporting domestic heavy industry.\n\u2022 2. South-Western Plateau Belt [1.5 Marks]:\n  - Encompasses Karnataka, Goa, and upland Tamil Nadu/Kerala; rich in high-grade haematite, manganese, and bauxite, though it lacks coking coal.\n\u2022 3. North-Western Belt [1.5 Marks]:\n  - Runs along the Aravalli range in Rajasthan and Gujarat; contains non-ferrous minerals (copper, zinc, lead), gypsum, and petroleum in the Cambay and Barmer basins.\n\u2022 4. Geological Synthesis [0.5 Mark]:\n  - Demonstrates that mineral distribution is closely tied to regional geology: metamorphic Dharwar rocks host metals, Gondwana basins hold coal, and marine sedimentary strata contain petroleum."}, {"id": 47, "type": "LA", "tag": "CBSE 2020", "question": "Examine the distribution, extraction, and industrial applications of 'Copper' and 'Bauxite' in India. Why does India rely on copper imports while being self-sufficient in bauxite? [5 Marks]", "answer": "Examination: Copper (Scarce reserves, Balaghat in MP, Khetri in Rajasthan, Singhbhum in Jharkhand; Electrical, automobile, wiring; Imports needed from Chile); Bauxite (Abundant, Panchpatmali in Odisha, Amarkantak in MP, Kolhapur in Maharashtra; Aluminum smelting, aviation, lightweight engineering; Export surplus).", "explanation": "Step-by-Step Marking Scheme (2.5 Marks Copper profile & import dependency + 2.5 Marks Bauxite profile & self-sufficiency):\n\u2022 1. Copper: Distribution & Import Dependency [2.5 Marks]:\n  - Characteristics & Use: Non-ferrous, ductile metal essential for electrical wiring, motors, generators, and electronics.\n  - Distribution: Domestic reserves are limited; mined at Malanjkhand (Balaghat, MP), Khetri (Jhunjhunu, Rajasthan), and Singhbhum (Jharkhand).\n  - Import Need: Domestic production meets only a fraction of industrial demand, requiring copper imports from Chile and Indonesia.\n\u2022 2. Bauxite: Distribution & Self-Sufficiency [2.5 Marks]:\n  - Characteristics & Use: The primary ore of aluminum, valued for its light weight and corrosion resistance in aviation, electrical, and construction sectors.\n  - Distribution: Abundant deposits in Odisha (Panchpatmali in Koraput), Jharkhand (Lohardaga), and Gujarat (Bhavnagar).\n  - Self-Sufficiency: India maintains sufficient reserves to support domestic aluminum smelters and export refined alumina."}, {"id": 48, "type": "LA", "tag": "CBSE 2019", "question": "Discuss the 'Conservation of Mineral and Energy Resources' in India. Why is conservation urgent, and what policy, technological, and recycling strategies should be adopted? [5 Marks]", "answer": "Comprehensive examination: Urgency (Exhaustible, slow geological replenishment, environmental degradation, industrial demand); Strategies: (1) Scrap metal recycling; (2) Upgrading beneficiation technology for low-grade ores; (3) Substituting scarce minerals with abundant alternatives; (4) Expanding renewable energy.", "explanation": "Step-by-Step Marking Scheme (2 Marks urgency of conservation + 3 Marks strategic measures):\n\u2022 1. The Urgency of Conservation [2 Marks]:\n  - Minerals and fossil fuels are non-renewable; geological replenishment takes millions of years, while industrial consumption is rapid.\n  - Mining generates surface scarring, deforestation, and air pollution, highlighting the need for efficient resource use.\n\u2022 2. Strategic Conservation Measures [3 Marks]:\n  - Scrap Recycling: Expanding scrap metal recovery (iron, copper, aluminum) reduces the demand for virgin ore and lowers processing energy.\n  - Technological Beneficiation: Utilizing improved ore-dressing technologies to process low-grade ores and reduce extraction tailings.\n  - Material Substitution & Renewables: Replacing scarce metals with engineering polymers or composite ceramics, while transitioning power generation from coal to solar and wind."}, {"id": 49, "type": "LA", "tag": "CBSE 2018", "question": "Evaluate the role of 'Natural Gas' as a transition fuel in India's energy economy. Discuss its environmental merits over coal, major producing basins, and the role of the national gas pipeline grid (including the HVJ pipeline). [5 Marks]", "answer": "Evaluation: Clean fossil fuel (Lower carbon emissions, zero particulate ash); Transition fuel to renewables; Major basins: Mumbai High, Bassein, KG Basin, Assam, Tripura, Rajasthan; Gas infrastructure: GAIL (1984), HVJ pipeline (1,750 km); City gas distribution (CNG/PNG).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks environmental merits + 1.5 Marks producing basins + 2 Marks pipeline grid & city gas distribution):\n\u2022 1. Environmental Merits as a Transition Fuel [1.5 Marks]:\n  - Emits roughly 50% less carbon dioxide than coal and produces virtually no particulate ash or sulfur dioxide when burned.\n  - Acts as a flexible transition fuel to back up intermittent solar and wind power on the national grid.\n\u2022 2. Major Natural Gas Basins [1.5 Marks]:\n  - Sourced from western offshore fields (Mumbai High, Bassein), the eastern offshore Krishna-Godavari (KG) basin, and onshore fields in Assam, Tripura, and Rajasthan.\n\u2022 3. Pipeline Infrastructure & City Gas Distribution [2 Marks]:\n  - Managed by GAIL, including the 1,750-km Hazira-Vijaipur-Jagdishpur (HVJ) pipeline network connecting western gas to northern industrial centers.\n  - Supplies Compressed Natural Gas (CNG) for urban transport and Piped Natural Gas (PNG) for residential cooking."}, {"id": 50, "type": "LA", "tag": "CBSE 2017", "question": "\"The transition to non-conventional renewable energy is not just an environmental imperative, but a socio-economic necessity for India.\" Critically analyze this statement in light of India's energy security, carbon commitments, and rural employment. [5 Marks]", "answer": "Critical analysis: Socio-economic and environmental imperatives; Energy security (Overcoming 85% crude oil import dependency, shield from global price shocks); Carbon commitments (Panchamrit, net-zero by 2070); Rural employment (Solar
