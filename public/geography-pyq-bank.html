ning Towns", "(b) Tourist Resorts", "(c) Administrative Capitals", "(d) Religious Pilgrimage Towns"], "answer": "(a) Mining Towns", "explanation": "These towns grew around mineral extraction\u2014coal in Jharia and Raniganj, petroleum in Digboi, and thermal coal in Singrauli."}, {"id": 14, "type": "MCQ", "tag": "CBSE 2017", "question": "The 'Smart Cities Mission' was launched by the Government of India in 2015 with the core objective of:", "options": ["(a) Promoting cities that provide core infrastructure, a clean and sustainable environment, and smart solutions to give a decent quality of life to citizens", "(b) Relocating all rural villagers into desert tents", "(c) Banning all motor vehicles in urban areas", "(d) Converting all cities into agricultural fields"], "answer": "(a) Promoting cities that provide core infrastructure, a clean and sustainable environment, and smart solutions to give a decent quality of life to citizens", "explanation": "The Smart Cities Mission focuses on urban renewal through core infrastructure, sustainable resource management, and digital solutions."}, {"id": 15, "type": "MCQ", "tag": "CBSE 2017", "question": "Which of the following is a 'Medieval Town' that developed as a kingdom capital and fort headquarters in India?", "options": ["(a) Delhi, Hyderabad, and Jaipur", "(b) Chandigarh and Gandhinagar", "(c) Jamshedpur and Bhilai", "(d) Sindri and Barauni"], "answer": "(a) Delhi, Hyderabad, and Jaipur", "explanation": "Delhi, Hyderabad, Jaipur, Lucknow, Agra, and Nagpur developed during the medieval era as administrative centers and fortified kingdom capitals."}, {"id": 16, "type": "MCQ", "tag": "CBSE 2016", "question": "In which region of India are 'Clustered Settlements' predominantly found due to flat fertile soils and security needs?", "options": ["(a) The Northern Plains and Bundelkhand", "(b) Dense rainforests of the Western Ghats", "(c) Mangroves of the Sundarbans", "(d) High cold deserts of Spiti"], "answer": "(a) The Northern Plains and Bundelkhand", "explanation": "Clustered settlements are common in the Northern Plains for agricultural coordination, and in Bundelkhand and Nagaland for historical defense."}, {"id": 17, "type": "MCQ", "tag": "CBSE 2016", "question": "Satellite towns developed on the periphery of metropolitan cities to relieve congestion\u2014such as Gurugram and Noida near Delhi\u2014are examples of:", "options": ["(a) Modern Planned Suburbs / Satellite Towns", "(b) Ancient Fort Capitals", "(c) Rural Hamleted Dhani", "(d) Mining Camps"], "answer": "(a) Modern Planned Suburbs / Satellite Towns", "explanation": "Gurugram, Noida, and Navi Mumbai were developed as modern satellite cities to absorb metropolitan population growth and corporate expansion."}, {"id": 18, "type": "MCQ", "tag": "CBSE 2015", "question": "Kandla, Kochi, Visakhapatnam, and Paradip are functionally classified as:", "options": ["(a) Transport and Port Towns", "(b) Educational Towns", "(c) Cantonment Towns", "(d) Hill Resorts"], "answer": "(a) Transport and Port Towns", "explanation": "These coastal cities developed around major marine ports, serving as export-import and transshipment hubs."}, {"id": 19, "type": "MCQ", "tag": "CBSE 2024", "question": "Shimla, Mussoorie, Nainital, and Ooty (Udhagamandalam) belong to which functional category of towns?", "options": ["(a) Tourist and Hill Resort Towns", "(b) Industrial Steel Towns", "(c) Mining Coal Towns", "(d) Border Garrison Towns"], "answer": "(a) Tourist and Hill Resort Towns", "explanation": "Established during British rule to escape summer heat, these towns function as major hill stations and tourism centers."}, {"id": 20, "type": "MCQ", "tag": "CBSE 2023", "question": "What is an 'Urban Agglomeration' (UA)?", "options": ["(a) A continuous urban spread consisting of a town and its adjoining urban outgrowths, or two or more contiguous towns", "(b) A collection of ten deserted villages", "(c) A farm with two tractors", "(d) An isolated forest hermitage"], "answer": "(a) A continuous urban spread consisting of a town and its adjoining urban outgrowths, or two or more contiguous towns", "explanation": "An Urban Agglomeration comprises a core city and its contiguous urban outgrowths (e.g. railway colonies, university campuses, suburban extensions)."}, {"id": 21, "type": "MCQ", "tag": "CBSE 2022", "question": "Which of the following describes the basic difference between rural and urban settlements?", "options": ["(a) Rural settlements derive their livelihood predominantly from primary activities, whereas urban settlements depend on secondary and tertiary services", "(b) Rural people speak only Latin while urban people speak Greek", "(c) Rural settlements have zero sunlight", "(d) Urban settlements have no buildings"], "answer": "(a) Rural settlements derive their livelihood predominantly from primary activities, whereas urban settlements depend on secondary and tertiary services", "explanation": "Rural settlements are anchored in primary resource extraction (farming, fishing, forestry), whereas urban economies center on manufacturing, trade, and services."}, {"id": 22, "type": "MCQ", "tag": "CBSE 2021", "question": "In Rajasthan, rural houses are frequently found clustered tightly together in an otherwise arid landscape around:", "options": ["(a) The scarce available water sources (wells, ponds, johads)", "(b) Active volcanic vents", "(c) Salt sand dunes", "(d) Dense pine forests"], "answer": "(a) The scarce available water sources (wells, ponds, johads)", "explanation": "In arid western Rajasthan, water scarcity causes nucleated clustering around dependable wells, tanks, and seasonal ponds (johads)."}, {"id": 23, "type": "MCQ", "tag": "CBSE 2020", "question": "Which Indian city recorded the LARGEST population as an Urban Agglomeration in the 2011 Census?", "options": ["(a) Greater Mumbai (18.4 million)", "(b) Delhi", "(c) Kolkata", "(d) Chennai"], "answer": "(a) Greater Mumbai (18.4 million)", "explanation": "Greater Mumbai was the largest Urban Agglomeration in India in the 2011 Census with 18.4 million residents, followed closely by Delhi."}, {"id": 24, "type": "MCQ", "tag": "CBSE 2019", "question": "Which of the following is an example of an 'Administrative Town' in India?", "options": ["(a) New Delhi, Bhopal, and Gandhinagar", "(b) Jharia and Raniganj", "(c) Shimla and Manali", "(d) Katni and Itarsi"], "answer": "(a) New Delhi, Bhopal, and Gandhinagar", "explanation": "New Delhi, Bhopal, and Gandhinagar serve as national or state capital centers housing administrative ministries, secretariats, and legislatures."}, {"id": 25, "type": "MCQ", "tag": "CBSE 2018", "question": "Class VI towns according to the Indian Census classification have a population of:", "options": ["(a) Less than 5,000", "(b) 5,000 to 9,999", "(c) 10,000 to 19,999", "(d) Above 100,000"], "answer": "(a) Less than 5,000", "explanation": "Class VI towns are the smallest statutory urban units recognized by the Census, having a population of less than 5,000 residents."}, {"id": 26, "type": "AR", "tag": "CBSE 2024", "question": "Assertion (A): Clustered rural settlements are widely prevalent throughout the fertile alluvial plains of Northern India.\nReason (R): Flat relief, deep fertile soils, and perennial river water support intensive sedentary agriculture, while security concerns historically encouraged nucleated villages.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true and (R) explains (A). Alluvial soil fertility supports high rural densities, while security concerns and water management encouraged compact village structures."}, {"id": 27, "type": "AR", "tag": "CBSE 2023", "question": "Assertion (A): Dispersed settlements consist of isolated huts or farmsteads scattered across remote hills and slopes.\nReason (R): Highly fragmented terrain, rugged relief, and dispersed natural resource pockets prevent the formation of large compact villages in mountainous areas like Meghalaya and Uttarakhand.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true and (R) explains (A). Physical terrain fragmentation and scattered terraced fields naturally lead to isolated, dispersed homesteads."}, {"id": 28, "type": "AR", "tag": "CBSE 2022", "question": "Assertion (A): The Smart Cities Mission was launched exclusively to build luxury golf courses and five-star casinos in rural farming hamlets.\nReason (R): The primary objective of the Smart Cities Mission is to convert all agricultural lands into private helicopter landing strips.", "options": ["(a) Both (A) and (R) are true", "(b) Both (A) and (R) are false", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(b) Both (A) and (R) are false", "explanation": "Both statements are false: The Smart Cities Mission is an urban renewal initiative focused on municipal infrastructure, sustainable services, and digital governance."}, {"id": 29, "type": "AR", "tag": "CBSE 2021", "question": "Assertion (A): Rural and urban settlements in India exist in complete isolation and have zero economic interaction with each other.\nReason (R): Urban centers produce all their own agricultural food grains inside high-rise skyscraper elevators without needing rural produce.", "options": ["(a) Both (A) and (R) are true", "(b) Both (A) and (R) are false", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(b) Both (A) and (R) are false", "explanation": "Both statements are false: Rural and urban areas are economically interdependent; rural areas supply food and raw materials, while urban centers supply manufactured goods and services."}, {"id": 30, "type": "AR", "tag": "CBSE 2020", "question": "Assertion (A): Ancient Indian towns like Varanasi, Prayagraj, and Madurai developed primarily as religious, pilgrimage, and cultural centers.\nReason (R): They were established over 2,000 years ago along sacred rivers or around grand temple complexes.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true. Ancient towns in India grew around sacred pilgrimage riverbanks and temple sites over two millennia ago."}, {"id": 31, "type": "SA", "tag": "CBSE 2024", "question": "Differentiate between 'Clustered Settlements' and 'Dispersed Settlements' in India with examples. [3 Marks]", "answer": "Clustered: Compact, nucleated, contiguous houses, geometric streets (Northern Plains); Dispersed: Isolated huts, scattered on hills/forests (Meghalaya, Uttarakhand).", "explanation": "Marking Scheme (1.5 Marks Clustered + 1.5 Marks Dispersed):\n\u2022 Clustered (Nucleated) Settlements:\n  - Structure: Houses are built close together, with living quarters distinct from surrounding farm fields.\n  - Geographic Prevalence: Found across fertile alluvial plains (e.g. Northern Plains) and defense corridors (Bundelkhand).\n\u2022 Dispersed Settlements:\n  - Structure: Isolated farmsteads or small hamlets scattered across hillsides, jungles, or pasture land.\n  - Geographic Prevalence: Common in rugged mountain terrain (e.g. Meghalaya, Uttarakhand, Himachal Pradesh)."}, {"id": 32, "type": "SA", "tag": "CBSE 2024", "question": "Explain the three criteria adopted by the Census of India to define an 'Urban Settlement'. [3 Marks]", "answer": "1. Population of at least 5,000; 2. 75%+ male main workers in non-agricultural activities; 3. Density of at least 400 persons/sq km.", "explanation": "Marking Scheme (1 Mark for each statutory/census criterion):\n\u2022 1. Minimum Population: Must have a total population of at least 5,000 persons.\n\u2022 2. Non-Agricultural Employment: At least 75% of the male main working population must be engaged in non-agricultural pursuits.\n\u2022 3. Population Density: Must have a minimum density of 400 persons per square kilometer (along with statutory civic administration)."}, {"id": 33, "type": "SA", "tag": "CBSE 2023", "question": "What are 'Hamleted Settlements'? Name any three local terms used for hamlets in India. [3 Marks]", "answer": "Village physically divided into several units bearing a common name; Local terms: Panna, Para, Palli, Nagla, Dhani.", "explanation": "Marking Scheme (1.5 Marks definition + 1.5 Marks local terms):\n\u2022 Definition: Settlements where a single recognized village is divided into physically separate hamlets separated by cultivated fields, driven by social and ethnic factors.\n\u2022 Local Terms: Known in different regional dialects as Panna, Para, Palli, Nagla, and Dhani across the Middle and Lower Ganga Plains."}, {"id": 34, "type": "SA", "tag": "CBSE 2023", "question": "Explain how towns in India evolved during the 'Ancient', 'Medieval', and 'Modern' historical periods with one example of each. [3 Marks]", "answer": "Ancient: Religious/cultural centers over 2,000 years old (Varanasi); Medieval: Kingdom/fort capitals (Delhi/Jaipur); Modern: British ports and industrial/planned cities (Mumbai/Chandigarh).", "explanation": "Marking Scheme (1 Mark for each historical category with example):\n\u2022 1. Ancient Towns: Religious and cultural centers with over 2,000 years of history (e.g. Varanasi, Prayagraj, Madurai).\n\u2022 2. Medieval Towns: Developed as kingdom capitals and garrison fort headquarters during the medieval era (e.g. Delhi, Hyderabad, Jaipur, Lucknow).\n\u2022 3. Modern Towns: Established by European powers as coastal trading ports (Mumbai, Chennai, Kolkata) or planned post-independence capitals and industrial centers (Chandigarh, Bhilai)."}, {"id": 35, "type": "SA", "tag": "CBSE 2022", "question": "What is an 'Urban Agglomeration' (UA)? Mention its three possible configurations. [3 Marks]", "answer": "Continuous urban spread; Configurations: (a) Town and adjoining outgrowths; (b) Two or more contiguous towns; (c) City and adjoining towns.", "explanation": "Marking Scheme (1 Mark definition + 2 Marks three configurations):\n\u2022 Definition: A continuous urban spread consisting of a core city or town alongside its contiguous urban extensions.\n\u2022 Three Possible Configurations:\n  1. A city or town with one or more continuous urban outgrowths (railway colonies, university campuses).\n  2. Two or more contiguous towns with or without outgrowths.\n  3. A central city and one or more adjoining towns forming a contiguous urban spread."}, {"id": 36, "type": "SA", "tag": "CBSE 2022", "question": "Describe the functional classification of 'Industrial Towns' and 'Mining Towns' in India with two examples of each. [3 Marks]", "answer": "Industrial: Steel and factory production (Jamshedpur, Bhilai); Mining: Mineral extraction (Jharia, Raniganj, Digboi).", "explanation": "Marking Scheme (1.5 Marks Industrial Towns + 1.5 Marks Mining Towns):\n\u2022 Industrial Towns: Centers focused on heavy manufacturing, metal smelting, and factory production (e.g. Jamshedpur, Bhilai, Rourkela).\n\u2022 Mining Towns: Established around mineral extraction sites (e.g. coal in Jharia and Raniganj, oil in Digboi and Ankleshwar)."}, {"id": 37, "type": "SA", "tag": "CBSE 2020", "question": "Explain the concept of 'Semi-Clustered Settlements'. Where are they found in India? [3 Marks]", "answer": "Segregated village pattern; dominant landowning caste in center, lower castes on periphery; prevalent in Gujarat and Rajasthan.", "explanation": "Marking Scheme (1.5 Marks concept + 1.5 Marks spatial prevalence):\n\u2022 Concept: A settlement pattern resulting from the social segregation or outward expansion of a nucleated village; dominant landowning castes occupy the center, while lower social strata reside in peripheral hamlets.\n\u2022 Spatial Prevalence: Found across the plains of Gujarat and parts of Rajasthan."}, {"id": 38, "type": "SA", "tag": "CBSE 2019", "question": "What are 'Administrative Towns'? Name any four state capitals that serve this function. [3 Marks]", "answer": "Towns housing government secretariats and headquarters; Examples: New Delhi, Chandigarh, Gandhinagar, Bhopal, Dispur.", "explanation": "Marking Scheme (1 Mark definition + 2 Marks four examples):\n\u2022 Definition: Cities whose primary function is administering public governance, housing state or national secretariats, ministries, and high courts.\n\u2022 Examples: New Delhi (National Capital), Chandigarh (Punjab/Haryana), Gandhinagar (Gujarat), and Bhopal (Madhya Pradesh)."}, {"id": 39, "type": "SA", "tag": "CBSE 2018", "question": "State the core objectives of the 'Smart Cities Mission' in India. [3 Marks]", "answer": "Core infrastructure, clean and sustainable environment, smart digital solutions, decent quality of life for citizens.", "explanation": "Marking Scheme (1 Mark for each core objective):\n\u2022 1. Core Municipal Infrastructure: Providing clean water supply, assured electricity, efficient sanitation, and affordable housing.\n\u2022 2. Environmental Sustainability: Developing green public spaces, non-motorized transport corridors, and sustainable waste recycling.\n\u2022 3. Smart Digital Solutions: Applying IT solutions to traffic management, public safety, online service delivery, and disaster resilience."}, {"id": 40, "type": "SA", "tag": "CBSE 2017", "question": "Differentiate between 'Metropolitan Cities' and 'Mega Cities' in India with examples. [3 Marks]", "answer": "Metropolitan: Population 1 to 5 million (Pune, Surat); Mega City: Population 5 million and above (Greater Mumbai, Delhi, Kolkata).", "explanation": "Marking Scheme (1.5 Marks Metropolitan + 1.5 Marks Mega City):\n\u2022 Metropolitan Cities: Urban agglomerations or cities with a population between 1 million and 5 million (e.g. Pune, Ahmedabad, Jaipur, Surat).\n\u2022 Mega Cities: Large urban centers with a population of 5 million or more (e.g. Greater Mumbai, Delhi, Kolkata, Chennai, Bengaluru)."}, {"id": 41, "type": "LA", "tag": "CBSE 2024", "question": "Examine the four types of Rural Settlements in India: (a) Clustered, (b) Semi-Clustered, (c) Hamleted, and (d) Dispersed. Detail their physical characteristics, socio-cultural drivers, and geographical distribution. [5 Marks]", "answer": "Comprehensive examination: Four types of rural settlements; (1) Clustered/Nucleated (Compact, geometric alleys, Northern Plains, defense in Bundelkhand); (2) Semi-Clustered (Social segregation, dominant caste center, peripheral outcastes, Gujarat/Rajasthan); (3) Hamleted (Panna/Para/Palli, Middle Ganga plain); (4) Dispersed (Isolated huts, rugged hills, Meghalaya, Uttarakhand, Kerala).", "explanation": "Step-by-Step Marking Scheme (1.25 Marks each for the four rural settlement types):\n\u2022 1. Clustered / Nucleated Settlements [1.25 Marks]:\n  - Form: Compact, closely built-up residential units, distinct from surrounding cultivated farmland.\n  - Drivers & Locations: Common in the fertile Northern Plains for collective farming, in Bundelkhand and Nagaland for defense, and around water bodies in Rajasthan.\n\u2022 2. Semi-Clustered or Fragmented Settlements [1.25 Marks]:\n  - Form: Results from social segregation within a nucleated village.\n  - Drivers & Locations: Dominant landowning groups occupy the village core, while service and manual labor castes reside in peripheral quarters; common in Gujarat and Rajasthan.\n\u2022 3. Hamleted Settlements [1.25 Marks]:\n  - Form: A village physically divided into separate small hamlets, locally termed Panna, Para, Palli, Nagla, or Dhani.\n  - Drivers & Locations: Driven by social and ethnic segmentation; common across the Middle and Lower Ganga Plains and Chhattisgarh.\n\u2022 4. Dispersed or Isolated Settlements [1.25 Marks]:\n  - Form: Isolated farmsteads or huts scattered over hillsides, forests, and pasture lands.\n  - Drivers & Locations: Shaped by rugged terrain, steep relief, and fragmented arable pockets; found in Meghalaya, Uttarakhand, Himachal Pradesh, and Kerala."}, {"id": 42, "type": "LA", "tag": "CBSE 2024", "question": "Trace the historical evolution of towns in India from antiquity to the post-independence era. Discuss: (a) Ancient Towns, (b) Medieval Towns, and (c) Modern Towns with suitable geographic examples. [5 Marks]", "answer": "Detailed historical analysis: (1) Ancient Towns (Religious/cultural hubs, 2000+ years, Varanasi, Prayagraj, Pataliputra, Madurai); (2) Medieval Towns (Kingdom headquarters, fort capitals, Delhi, Hyderabad, Jaipur, Lucknow, Agra); (3) Modern Towns (British port gateways: Mumbai, Kolkata, Chennai; Industrial nodes: Jamshedpur; Post-independence planned capitals: Chandigarh, Gandhinagar).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks Ancient Towns + 1.5 Marks Medieval Towns + 2 Marks Modern Towns):\n\u2022 1. Ancient Towns (Over 2,000 Years Old) [1.5 Marks]:\n  - Developed primarily as religious, pilgrimage, and cultural centers along riverbanks or trade routes.\n  - Examples: Varanasi, Prayagraj, Pataliputra (Patna), and Madurai.\n\u2022 2. Medieval Towns (Kingdom Capitals & Forts) [1.5 Marks]:\n  - Grew as fortified administrative headquarters for principalities and sultanates, featuring forts and walled bazaars.\n  - Examples: Delhi, Hyderabad, Jaipur, Lucknow, Agra, and Nagpur.\n\u2022 3. Modern Towns (Colonial to Post-Independence) [2 Marks]:\n  - Colonial Phase: European powers established coastal trading ports (Surat, Goa, Mumbai, Chennai, Kolkata), hill stations (Shimla, Ooty), and cantonments (Ambala).\n  - Post-Independence Phase: Developed planned administrative capitals (Chandigarh, Gandhinagar, Bhubaneswar) and industrial centers (Bhilai, Rourkela, Jamshedpur)."}, {"id": 43, "type": "LA", "tag": "CBSE 2023", "question": "Provide a comprehensive 'Functional Classification of Indian Towns'. Discuss: (a) Administrative Towns, (b) Industrial Towns, (c) Transport Towns, (d) Mining Towns, (e) Educational Towns, and (f) Religious/Cultural Towns with examples. [5 Marks]", "answer": "Comprehensive functional classification: (1) Administrative (New Delhi, Chandigarh, Gandhinagar); (2) Industrial (Bhilai, Jamshedpur, Rourkela); (3) Transport & Ports (Kandla, Kochi, Visakhapatnam); (4) Mining (Jharia, Raniganj, Digboi); (5) Educational (Roorkee, Aligarh, Pilani); (6) Religious/Cultural (Varanasi, Mathura, Amritsar, Puri).", "explanation": "Step-by-Step Marking Scheme (1 Mark each for any five functional categories with illustrative examples, max 5 Marks):\n\u2022 1. Administrative Towns [1 Mark]:\n  - Focus on state or national governance; includes New Delhi, Chandigarh, Gandhinagar, and Bhopal.\n\u2022 2. Industrial Towns [1 Mark]:\n  - Driven by manufacturing and metal production; includes Jamshedpur, Bhilai, Rourkela, and Bokaro.\n\u2022 3. Transport & Port Towns [1 Mark]:\n  - Act as maritime ports or inland rail junctions; includes Kandla, Kochi, Visakhapatnam, and Pt. Deen Dayal Upadhyaya Junction.\n\u2022 4. Mining Towns [1 Mark]:\n  - Developed around mineral and energy extraction; includes Jharia, Raniganj, Digboi, and Singrauli.\n\u2022 5. Educational Towns [1 Mark]:\n  - Centered on universities, research centers, and colleges; includes Roorkee, Aligarh, Pilani, and Kota.\n\u2022 6. Religious & Cultural Towns [1 Mark]:\n  - Ancient pilgrimage and heritage centers; includes Varanasi, Mathura, Amritsar, and Puri."}, {"id": 44, "type": "LA", "tag": "CBSE 2023", "question": "Examine the classification of Indian urban settlements based on 'Population Size' as laid down by the Census of India (Class I to Class VI). Explain the concepts of Metropolitan Cities, Mega Cities, and Urban Agglomerations. [5 Marks]", "answer": "Detailed examination: Census size classes (Class I: 100,000+; Class II: 50,000-99,999; Class III: 20,000-49,999; Class IV: 10,000-19,999; Class V: 5,000-9,999; Class VI: <5,000); Metropolitan (1-5 million, 53 cities); Mega Cities (5 million+, Mumbai, Delhi); Urban Agglomerations.", "explanation": "Step-by-Step Marking Scheme (2 Marks Class I-VI size classes + 1.5 Marks Metropolitan & Mega Cities + 1.5 Marks Urban Agglomeration definition & mechanics):\n\u2022 1. Census Size Classes (Class I to VI) [2 Marks]:\n  - Class I: 100,000 and above (Cities).\n  - Class II: 50,000 to 99,999.\n  - Class III: 20,000 to 49,999.\n  - Class IV: 10,000 to 19,999.\n  - Class V: 5,000 to 9,999.\n  - Class VI: Less than 5,000.\n\u2022 2. Metropolitan & Mega Cities [1.5 Marks]:\n  - Metropolitan Cities: Urban centers with populations between 1 million and 5 million (53 recorded in the 2011 Census, such as Pune and Surat).\n  - Mega Cities: Urban centers with populations of 5 million or more (e.g. Greater Mumbai, Delhi, Kolkata, Chennai, Bengaluru).\n\u2022 3. Urban Agglomerations (UA) [1.5 Marks]:\n  - A continuous urban spread comprising a core town alongside its contiguous suburban and commercial outgrowths."}, {"id": 45, "type": "LA", "tag": "CBSE 2022", "question": "Analyze the 'Smart Cities Mission' as a flagship urban renewal program in India. Discuss its vision, key infrastructure elements, use of digital technology, and challenges of inclusive urban development. [5 Marks]", "answer": "Analysis: Launched in 2015 for 100 cities; Vision: Core infrastructure, sustainable environment, decent quality of life; Core elements: Water, electricity, sanitation, affordable housing, smart mobility; Digital solutions (ICT traffic, integrated command centers); Inclusion challenges (slums vs gentrification).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks vision & scope + 2 Marks key infrastructure & smart digital solutions + 1.5 Marks challenges & inclusion):\n\u2022 1. Vision & Scope of Smart Cities Mission [1.5 Marks]:\n  - Launched in 2015 to develop 100 cities into models of sustainable, citizen-friendly urban development.\n  - Focuses on compact, replicable development that balances economic growth with environmental sustainability.\n\u2022 2. Core Infrastructure & Digital Solutions [2 Marks]:\n  - Upgrades civic infrastructure: 24/7 water supply, reliable power, waste management, and public transit.\n  - Implements digital technologies: Integrated Command and Control Centers (ICCCs), smart traffic monitoring, and online municipal services.\n\u2022 3. Challenges & Social Inclusion [1.5 Marks]:\n  - Ensuring benefits reach informal settlements and marginalized populations rather than focusing solely on elite commercial zones.\n  - Balancing modern technology investments with affordable housing and essential public services."}, {"id": 46, "type": "LA", "tag": "CBSE 2021", "question": "Compare 'Rural' and 'Urban' settlements in India. How do physical morphology, occupational structures, social relationships, and infrastructure facilities differ between the two? [5 Marks]", "answer": "Comparative evaluation: (1) Occupational structure (Primary agriculture/fishing vs Secondary/tertiary industry/services); (2) Morphology & density (Spacious/scattered/low density vs High-rise/compact/congested); (3) Social relationships (Close-knit/informal vs Impersonal/formal); (4) Infrastructure; Dynamic interdependence.", "explanation": "Step-by-Step Marking Scheme (1.25 Marks each for Occupational structure, Morphology, Social relationships, and Interdependence):\n\u2022 1. Occupational Structure [1.25 Marks]:\n  - Rural settlements are anchored in primary resource extraction (farming, animal husbandry, fishing).\n  - Urban settlements center on secondary manufacturing, wholesale/retail trade, transport, and professional services.\n\u2022 2. Physical Morphology & Density [1.25 Marks]:\n  - Rural: Lower housing density with horizontal layouts interspersed with fields, orchards, and village ponds.\n  - Urban: High population density with vertical apartment blocks, commercial districts, and complex road networks.\n\u2022 3. Social Relations & Lifestyle [1.25 Marks]:\n  - Rural: Strong community and kinship ties with slower-paced social mobility.\n  - Urban: More heterogeneous, formal, and mobile social environments.\n\u2022 4. Economic Interdependence [1.25 Marks]:\n  - Mutual dependence: rural areas supply agricultural food and industrial inputs, while urban centers supply manufactured products, machinery, and specialized services."}, {"id": 47, "type": "LA", "tag": "CBSE 2020", "question": "Examine how 'Physical Factors', 'Cultural Factors', and 'Security Factors' determine the type and spatial pattern of rural settlements in India. [5 Marks]", "answer": "Detailed examination: (1) Physical factors (Relief/topography, climate, water availability; flat plains produce clustered, hills produce dispersed, desert water spots produce nucleated); (2) Cultural/Ethnic factors (Caste segregation, tribal groupings, hamleted settlements); (3) Security factors (Defense from invasions/wildlife, Bundelkhand forts, Nagaland ridge settlements).", "explanation": "Step-by-Step Marking Scheme (2 Marks physical factors + 1.5 Marks cultural/ethnic factors + 1.5 Marks security factors):\n\u2022 1. Physical Determinants [2 Marks]:\n  - Relief & Terrain: Flat alluvial plains support compact clustered villages, while rugged mountain topography in the Himalayas results in dispersed farmsteads.\n  - Water Availability: In arid Rajasthan, settlements cluster tightly around scarce perennial wells and ponds (johads).\n\u2022 2. Cultural & Ethnic Determinants [1.5 Marks]:\n  - Social and caste hierarchies can divide villages, producing semi-clustered or hamleted layouts where landowning groups occupy the core and laboring castes reside on the outskirts.\n\u2022 3. Security Determinants [1.5 Marks]:\n  - Historical defense needs encouraged nucleated settlements in regions like Bundelkhand and the ridge-top villages of Nagaland to guard against raids and wildlife."}, {"id": 48, "type": "LA", "tag": "CBSE 2019", "question": "Discuss the rapid growth of 'Metropolitan Cities' and 'Million-Plus Agglomerations' in India. What environmental, infrastructural, and socio-economic challenges arise from rapid metropolitan expansion? [5 Marks]", "answer": "Analysis: Metropolitan growth from 35 (2001) to 53 (2011); Drivers: Economic centralization, industrial clusters, rural migration; Challenges: (1) Proliferation of informal slums (Dharavi); (2) Traffic congestion; (3) Water scarcity and sewage bottlenecks; (4) Air pollution; (5) High land prices.", "explanation": "Step-by-Step Marking Scheme (1.5 Marks growth trends & drivers + 2 Marks infrastructural & environmental challenges + 1.5 Marks urban planning solutions):\n\u2022 1. Growth Trends & Drivers [1.5 Marks]:\n  - Million-plus cities increased from 35 in 2001 to 53 in 2011, driven by rural-to-urban migration and industrial clustering in major economic corridors.\n\u2022 2. Infrastructural & Environmental Pressures [2 Marks]:\n  - Housing Deficits: High land costs lead to overcrowded informal settlements (e.g. Dharavi in Mumbai) lacking basic sanitation.\n  - Municipal Strain: Outpaces water supply and sewage networks, while vehicle growth causes traffic congestion and severe air pollution.\n\u2022 3. Urban Planning Interventions [1.5 Marks]:\n  - Highlights the need for regional planning, including developing satellite towns, bus rapid transit systems (BRTS), metro rail networks, and decentralized employment centers."}, {"id": 49, "type": "LA", "tag": "CBSE 2018", "question": "\"Towns in India are rarely mono-functional; as they grow, they develop diverse poly-functional characteristics.\" Evaluate this statement with examples from major Indian cities like Mumbai, Delhi, and Kolkata. [5 Marks]", "answer": "Evaluation: Dynamic evolution of urban functions; Initial specialization (e.g. Mumbai as port, Delhi as political capital); Transition to poly-functional hubs: Mumbai (Commercial capital, Bollywood, port, IT, banking); Delhi (Political capital, education, IT, trade); Kolkata (Cultural, port, manufacturing, education).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks concept of poly-functional transition + 2 Marks case studies of Mumbai & Delhi + 1.5 Marks regional implications):\n\u2022 1. The Poly-Functional Transition [1.5 Marks]:\n  - While towns often begin with a primary function (administrative, military, or port), population and economic growth add secondary and tertiary activities over time.\n\u2022 2. Case Studies: Mumbai & Delhi [2 Marks]:\n  - Mumbai: Began as a British trading port and textile center; evolved into India's financial capital, housing the stock exchange, corporate headquarters, entertainment, and IT services.\n  - Delhi: Began as a political and administrative capital; grew into a commercial, educational, and logistics hub for Northern India.\n\u2022 3. Regional Implications [1.5 Marks]:\n  - Functional diversification creates economic resilience, ensuring that cities continue to thrive even if a single industrial sector declines."}, {"id": 50, "type": "LA", "tag": "CBSE 2017", "question": "Assess the phenomenon of 'Peri-Urbanization' and the rise of satellite townships (like Gurugram, Noida, and Navi Mumbai). How do these planned suburbs alter land use and rural-urban fringe dynamics? [5 Marks]", "answer": "Assessment: Peri-urbanization (Growth on rural-urban fringe); Transformation of farmland into commercial hubs; Emergence of satellite cities (Gurugram, Noida, Navi Mumbai); Land use changes (Expressways, malls, IT parks, gated communities); Impact on local farming communities.", "explanation": "Step-by-Step Marking Scheme (2 Marks peri-urbanization dynamics + 1.5 Marks satellite towns case study + 1.5 Marks socio-ecological impacts):\n\u2022 1. Peri-Urbanization Dynamics [2 Marks]:\n  - Refers to the rapid transformation of the rural-urban fringe, where agricultural land is converted into residential suburbs, IT parks, and logistics zones.\n  - Driven by high urban land costs, pushing development outward along highway corridors.\n\u2022 2. Role of Planned Satellite Cities [1.5 Marks]:\n  - Satellite cities like Gurugram, Noida, and Navi Mumbai were established to absorb metropolitan population growth and house corporate offices.\n\u2022 3. Socio-Ecological Impacts [1.5 Marks]:\n  - Farmland conversion alters local hydrology and groundwater recharge.\n  - Former agrarian landholders transition into rental housing or real estate, while traditional village settlements (abadi) become surrounded by modern high-rises."}]}, {"info": {"chapter_num": 11, "book": "India: People and Economy", "title": "Land Resources and Agriculture", "author": "NCERT Class 12 Geography (029)", "weightage_unit": "Book 2 - Unit III: Resources & Development - Agriculture (5 Marks)"}, "questions": [{"id": 1, "type": "MCQ", "tag": "CBSE 2024", "question": "Which agricultural land use category comprises cultivable land that has been left fallow and uncultivated for more than five agricultural years to be brought under farming only through reclamation?", "options": ["(a) Culturable Wasteland", "(b) Current Fallow", "(c) Fallow other than Current Fallow", "(d) Barren and Wasteland"], "answer": "(a) Culturable Wasteland", "explanation": "Culturable Wasteland includes land that has remained uncultivated for more than five consecutive years; it can be rehabilitated for farming using land reclamation techniques."}, {"id": 2, "type": "MCQ", "tag": "CBSE 2024", "question": "Which state is the LARGEST producer of coffee in India, accounting for more than 70 percent of total national production predominantly from districts like Kodagu and Chikkamagaluru?", "options": ["(a) Karnataka", "(b) Kerala", "(c) Tamil Nadu", "(d) Andhra Pradesh"], "answer": "(a) Karnataka", "explanation": "Karnataka produces over 70% of India's coffee (both Arabica and Robusta varieties), concentrated in the highlands of Kodagu, Chikkamagaluru, and Hassan."}, {"id": 3, "type": "MCQ", "tag": "CBSE 2023", "question": "The formula to calculate 'Cropping Intensity' is expressed as:", "options": ["(a) (Gross Cropped Area / Net Sown Area) \u00d7 100", "(b) (Net Sown Area / Total Reporting Area) \u00d7 100", "(c) (Total Agricultural Population / Net Cultivated Area) \u00d7 100", "(d) (Gross Sown Area / Fallow Land) \u00d7 100"], "answer": "(a) (Gross Cropped Area / Net Sown Area) \u00d7 100", "explanation": "Cropping Intensity indicates the frequency with which crops are grown on a given plot of land within an agricultural year: (GCA / NSA) \u00d7 100."}, {"id": 4, "type": "MCQ", "tag": "CBSE 2023", "question": "Which of the following three crops of rice are cultivated in a single calendar year in West Bengal and Assam?", "options": ["(a) Aus, Aman, and Boro", "(b) Kharif, Rabi, and Zaid", "(c) Robusta, Arabica, and Liberica", "(d) Sonalika, Kalyan Sona, and Sharbati"], "answer": "(a) Aus, Aman, and Boro", "explanation": "Due to warm temperatures and abundant water in West Bengal, Assam, and coastal Odisha, farmers harvest three crops of rice annually: Aus (autumn), Aman (winter), and Boro (summer)."}, {"id": 5, "type": "MCQ", "tag": "CBSE 2022 Term-1", "question": "The 'Green Revolution' introduced in Indian agriculture during the mid-1960s was anchored primarily on which technological package?", "options": ["(a) High Yielding Varieties (HYV) of seeds, chemical fertilizers, pesticides, and assured canal/tubewell irrigation", "(b) Complete return to primitive slash-and-burn shifting cultivation", "(c) Hand-plowing using only wooden sticks without water", "(d) Sole reliance on unmonitored monsoon showers"], "answer": "(a) High Yielding Varieties (HYV) of seeds, chemical fertilizers, pesticides, and assured canal/tubewell irrigation", "explanation": "The Green Revolution combined dwarf High Yielding Variety (HYV) wheat and rice seeds with synthetic chemical fertilizers, pesticides, and assured irrigation."}, {"id": 6, "type": "MCQ", "tag": "CBSE 2022 Term-1", "question": "Which of the following is a leguminous pulse crop that fixes atmospheric nitrogen in the soil, helping maintain and restore soil fertility?", "options": ["(a) Gram and Tur (Arhar)", "(b) Sugarcane", "(c) Jute", "(d) Wheat"], "answer": "(a) Gram and Tur (Arhar)", "explanation": "Leguminous pulse crops possess root nodules that fix atmospheric nitrogen in the soil, making them essential for crop rotation and soil fertility."}, {"id": 7, "type": "MCQ", "tag": "CBSE 2021", "question": "Which state in India is the leading producer of 'Groundnut', cultivating it predominantly as a rainfed Kharif crop on dryland sandy soils?", "options": ["(a) Gujarat", "(b) Punjab", "(c) West Bengal", "(d) Assam"], "answer": "(a) Gujarat", "explanation": "Gujarat is the leading producer of groundnut in India (accounting for over a third of national production), centered in the Kathiawar peninsula."}, {"id": 8, "type": "MCQ", "tag": "CBSE 2020 Delhi", "question": "The short agricultural cropping season between the harvesting of Rabi crops and the sowing of Kharif crops (spanning April to June) is known as:", "options": ["(a) Zaid Season", "(b) Aus Season", "(c) Boro Season", "(d) Monsoon Season"], "answer": "(a) Zaid Season", "explanation": "Zaid is a short summer cropping season between March/April and June, used to cultivate watermelons, cucumbers, fodder crops, and vegetables under irrigation."}, {"id": 9, "type": "MCQ", "tag": "CBSE 2020 AI", "question": "Which soil type, formed from volcanic basalt lava, is best suited for the commercial cultivation of Cotton in Maharashtra and Gujarat?", "options": ["(a) Black Cotton Soil (Regur)", "(b) Alluvial Loam", "(c) Red Laterite", "(d) Sandy Desert Sand"], "answer": "(a) Black Cotton Soil (Regur)", "explanation": "Black soil (Regur) of the Deccan lava plateau is clayey, moisture-retentive, and rich in lime and iron, making it well-suited for rainfed cotton cultivation."}, {"id": 10, "type": "MCQ", "tag": "CBSE 2019", "question": "Which state recorded the highest average agricultural yield of wheat (exceeding 4,000 kg per hectare) in India?", "options": ["(a) Punjab", "(b) Bihar", "(c) Odisha", "(d) Kerala"], "answer": "(a) Punjab", "explanation": "Punjab (closely followed by Haryana) records the highest wheat yields in India, driven by comprehensive canal and tubewell irrigation, mechanization, and fertilizer use."}, {"id": 11, "type": "MCQ", "tag": "CBSE 2019", "question": "What is the defining feature of 'Current Fallow' land?", "options": ["(a) Agricultural land left uncultivated for one or less than one agricultural year to naturally regain fertility", "(b) Land left uncultivated for 50 years", "(c) Land covered by permanent ice caps", "(d) Land converted into cement factories"], "answer": "(a) Agricultural land left uncultivated for one or less than one agricultural year to naturally regain fertility", "explanation": "Current Fallow is arable land temporarily left unseeded for one season or up to one agricultural year to allow the soil to naturally restore its nutrient balance."}, {"id": 12, "type": "MCQ", "tag": "CBSE 2018", "question": "Which coarse cereal crop occupies about 5.3 percent of the total cropped area in India and is grown predominantly as a rainfed crop in Maharashtra and Karnataka?", "options": ["(a) Jowar (Sorghum)", "(b) Wheat", "(c) Barley", "(d) Tea"], "answer": "(a) Jowar (Sorghum)", "explanation": "Jowar is a major coarse grain grown in semi-arid peninsular India, with Maharashtra accounting for roughly half of the country's total output."}, {"id": 13, "type": "MCQ", "tag": "CBSE 2018", "question": "The 'Golden Fibre' of India, cultivated on deep fertile deltaic silt soils that are renewed annually by floodwaters, refers to:", "options": ["(a) Jute", "(b) Cotton", "(c) Silk", "(d) Wool"], "answer": "(a) Jute", "explanation": "Jute is known as the golden fiber; West Bengal is the leading producer, concentrated in the Ganga-Brahmaputra delta."}, {"id": 14, "type": "MCQ", "tag": "CBSE 2017", "question": "Which agricultural crop requires cool growing conditions during vegetative growth and bright, warm sunshine at the time of ripening?", "options": ["(a) Wheat", "(b) Rice", "(c) Jute", "(d) Rubber"], "answer": "(a) Wheat", "explanation": "Wheat is a temperate Rabi crop that requires cool growing temperatures (10\u00b0C\u201315\u00b0C) and clear, warm sunshine during maturity and harvest."}, {"id": 15, "type": "MCQ", "tag": "CBSE 2017", "question": "Dryland farming in India is practiced in regions receiving annual rainfall of less than:", "options": ["(a) 75 cm", "(b) 200 cm", "(c) 150 cm", "(d) 300 cm"], "answer": "(a) 75 cm", "explanation": "Dryland farming is practiced in semi-arid zones receiving under 75 cm of rainfall, relying on drought-resistant crops like ragi, bajra, and pulses."}, {"id": 16, "type": "MCQ", "tag": "CBSE 2016", "question": "India accounts for approximately what percentage of the world's total rice production, ranking second after China?", "options": ["(a) 21.6 percent", "(b) 50.0 percent", "(c) 5.2 percent", "(d) 10.0 percent"], "answer": "(a) 21.6 percent", "explanation": "India is the world's second-largest rice producer after China, contributing roughly 21.6% of global rice output."}, {"id": 17, "type": "MCQ", "tag": "CBSE 2016", "question": "Over-irrigation in canal-command areas of Punjab, Haryana, and the Indira Gandhi Canal command in Rajasthan has caused severe land degradation through:", "options": ["(a) Soil salinization, alkalization, and waterlogging", "(b) Volcanic lava eruption", "(c) Rapid permafrost formation", "(d) Complete depletion of all groundwater"], "answer": "(a) Soil salinization, alkalization, and waterlogging", "explanation": "Excessive flood irrigation without adequate sub-surface drainage brings underground salts to the surface, causing waterlogging and soil salinization."}, {"id": 18, "type": "MCQ", "tag": "CBSE 2015", "question": "Which of the following is a major Rabi oilseed crop cultivated extensively in Rajasthan, Uttar Pradesh, and Haryana?", "options": ["(a) Rapeseed and Mustard", "(b) Groundnut", "(c) Soyabean", "(d) Castor seed"], "answer": "(a) Rapeseed and Mustard", "explanation": "Rapeseed and mustard are temperate Rabi oilseeds grown in subtropical northern plains; Rajasthan leads national production."}, {"id": 19, "type": "MCQ", "tag": "CBSE 2024", "question": "What is the average size of agricultural operational landholdings in India according to recent agricultural censuses?", "options": ["(a) Less than 1.1 hectares (marginal and fragmented)", "(b) Above 50 hectares", "(c) Exactly 20 hectares", "(d) 100 hectares"], "answer": "(a) Less than 1.1 hectares (marginal and fragmented)", "explanation": "Due to generational inheritance division, India's average operational holding size has shrunk below 1.1 hectares, with over 86% classified as small and marginal."}, {"id": 20, "type": "MCQ", "tag": "CBSE 2023", "question": "Which Indian state is the LARGEST producer of Sugarcane in terms of total cropped area and harvest volume?", "options": ["(a) Uttar Pradesh", "(b) Maharashtra", "(c) Tamil Nadu", "(d) Punjab"], "answer": "(a) Uttar Pradesh", "explanation": "Uttar Pradesh has the largest acreage and highest production of sugarcane in India, followed by Maharashtra and Karnataka."}, {"id": 21, "type": "MCQ", "tag": "CBSE 2022", "question": "The two premier varieties of coffee grown commercially in India are:", "options": ["(a) Arabica and Robusta", "(b) Sonalika and Kalyan Sona", "(c) Aus and Aman", "(d) Assamica and Sinensis"], "answer": "(a) Arabica and Robusta", "explanation": "India cultivates both high-quality Arabica (known for its aroma) and Robusta coffee, primarily across Karnataka, Kerala, and Tamil Nadu."}, {"id": 22, "type": "MCQ", "tag": "CBSE 2021", "question": "Which Indian state leads in the production of Soyabean, earning it the moniker 'Soyabean State' of India?", "options": ["(a) Madhya Pradesh", "(b) Punjab", "(c) West Bengal", "(d) Kerala"], "answer": "(a) Madhya Pradesh", "explanation": "Madhya Pradesh (followed by Maharashtra) produces the majority of India's soyabean crop, centered on the Malwa plateau."}, {"id": 23, "type": "MCQ", "tag": "CBSE 2020", "question": "Tea plantations require which of the following physical environmental conditions for optimal growth?", "options": ["(a) Warm, humid subtropical climate, well-distributed annual rainfall, and well-drained, acidic hill slope soils without waterlogging", "(b) Freezing blizzards and stagnant muddy water", "(c) Alkaline desert sands with zero rainfall", "(d) Saline coastal sea water swamps"], "answer": "(a) Warm, humid subtropical climate, well-distributed annual rainfall, and well-drained, acidic hill slope soils without waterlogging", "explanation": "Tea bushes require deep, friable, acidic loam on well-drained hill slopes, as standing water around root systems damages the plants."}, {"id": 24, "type": "MCQ", "tag": "CBSE 2019", "question": "Fallow land left unseeded for a duration of more than one year but less than five years is categorized in land records as:", "options": ["(a) Fallow other than Current Fallow", "(b) Current Fallow", "(c) Culturable Wasteland", "(d) Barren Land"], "answer": "(a) Fallow other than Current Fallow", "explanation": "Land left uncultivated for more than 1 year but less than 5 years is classified as 'Fallow other than Current Fallow'; beyond 5 years, it becomes 'Culturable Wasteland'."}, {"id": 25, "type": "MCQ", "tag": "CBSE 2018", "question": "Bajra is a hardy coarse cereal crop grown predominantly during the Kharif season on:", "options": ["(a) Sandy soils and shallow black soils in Rajasthan and Maharashtra", "(b) Marshy waterlogged peat in Kerala", "(c) Deep Himalayan snowfields", "(d) Flooded mangrove soils"], "answer": "(a) Sandy soils and shallow black soils in Rajasthan and Maharashtra", "explanation": "Bajra is drought-resistant, growing well on sandy soils in Rajasthan (the leading producer), Gujarat, Maharashtra, and Haryana."}, {"id": 26, "type": "AR", "tag": "CBSE 2024", "question": "Assertion (A): Cultivation of pulses plays an indispensable ecological role in crop rotation across Indian farmlands.\nReason (R): Pulse crops belong to the leguminous family, whose root nodules harbor Rhizobium bacteria that fix atmospheric nitrogen, restoring soil fertility naturally.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true and (R) explains (A). Leguminous pulses fix nitrogen, making them valuable rotational crops between nutrient-demanding cereals like wheat and rice."}, {"id": 27, "type": "AR", "tag": "CBSE 2023", "question": "Assertion (A): The Green Revolution in India led to unprecedented regional disparities in agricultural development.\nReason (R): The Green Revolution technology package was initially concentrated in Punjab, Haryana, and Western Uttar Pradesh where assured irrigation infrastructure was already available.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true and (R) explains (A). Initial Green Revolution investments targeted well-irrigated northwestern states, boosting yields there while dryland regions lagged."}, {"id": 28, "type": "AR", "tag": "CBSE 2022", "question": "Assertion (A): Tea plantations in India are located almost exclusively on steep, well-drained hill slopes.\nReason (R): Stagnant water around the root system of tea bushes rots the delicate feeder roots and stunts plant growth.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true and (R) explains (A). Tea bushes require high rainfall but cannot tolerate waterlogging, which is why estates are established on sloped terrain."}, {"id": 29, "type": "AR", "tag": "CBSE 2021", "question": "Assertion (A): Net Sown Area and Gross Cropped Area in India are always mathematically identical in every state.\nReason (R): No farmer in India ever cultivates a plot of land more than once in an agricultural year.", "options": ["(a) Both (A) and (R) are true", "(b) Both (A) and (R) are false", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(b) Both (A) and (R) are false", "explanation": "Both statements are false: Gross Cropped Area includes land sown more than once; whenever multi-cropping occurs under irrigation, GCA exceeds Net Sown Area."}, {"id": 30, "type": "AR", "tag": "CBSE 2020", "question": "Assertion (A): Over-irrigation in the Indira Gandhi Canal command area has led to serious environmental land degradation.\nReason (R): Excessive canal water application in arid sandy tracts without proper drainage has caused rising water tables, waterlogging, and soil salinization.", "options": ["(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "(b) Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "(c) (A) is true but (R) is false", "(d) (A) is false but (R) is true"], "answer": "(a) Both (A) and (R) are true and (R) is the correct explanation of (A)", "explanation": "Both statements are true. In arid canal zones, heavy water application without drainage draws subsoil minerals to the surface through capillary action, salinizing farmland."}, {"id": 31, "type": "SA", "tag": "CBSE 2024", "question": "Differentiate between 'Net Sown Area' and 'Gross Cropped Area'. What does 'Cropping Intensity' indicate? [3 Marks]", "answer": "Net Sown Area: Physical land area cultivated, counted once; Gross Cropped Area: Net sown area plus area sown more than once; Cropping Intensity = (GCA / NSA) \u00d7 100.", "explanation": "Marking Scheme (1 Mark Net Sown Area + 1 Mark Gross Cropped Area + 1 Mark Cropping Intensity):\n\u2022 Net Sown Area (NSA): The total physical land area sown with crops and orchards, counted only once regardless of how many times it is planted in a year.\n\u2022 Gross Cropped Area (GCA): The total area sown once plus the area sown more than once during the same agricultural year.\n\u2022 Cropping Intensity: A percentage index measuring land use intensity: (GCA / NSA) \u00d7 100. Higher scores reflect multi-cropping supported by irrigation."}, {"id": 32, "type": "SA", "tag": "CBSE 2024", "question": "Describe the three distinct cropping seasons of India with suitable crop examples. [3 Marks]", "answer": "1. Kharif (June-Sept, onset of monsoon, rice, cotton); 2. Rabi (Oct-March, winter, wheat, mustard); 3. Zaid (April-June, summer, cucumber, watermelon).", "explanation": "Marking Scheme (1 Mark for each cropping season):\n\u2022 1. Kharif Season: Coincides with the southwest monsoon (June to September/October); crops include rice, cotton, jute, jowar, bajra, and groundnut.\n\u2022 2. Rabi Season: Begins with autumn sowing (October/November) and spring harvesting (March/April); crops include wheat, gram, barley, mustard, and peas.\n\u2022 3. Zaid Season: A short summer season (April to June) utilizing irrigation; crops include watermelons, cucumbers, seasonal vegetables, and fodder."}, {"id": 33, "type": "SA", "tag": "CBSE 2023", "question": "Differentiate between 'Dryland Farming' and 'Wetland Farming' in India. [3 Marks]", "answer": "Dryland: Rainfall <75 cm, drought-resistant crops (ragi, bajra), moisture conservation; Wetland: High rainfall/irrigation, excess moisture, rice, jute, sugarcane.", "explanation": "Marking Scheme (1.5 Marks Dryland + 1.5 Marks Wetland):\n\u2022 Dryland Farming:\n  - Practiced in semi-arid regions with annual rainfall below 75 cm.\n  - Relies on drought-hardy crops (ragi, bajra, gram) and soil-moisture conservation techniques.\n\u2022 Wetland Farming:\n  - Practiced in heavy rainfall regions or canal commands with surplus moisture.\n  - Supports water-demanding crops (wet paddy, jute, sugarcane) and aquaculture, but requires flood drainage management."}, {"id": 34, "type": "SA", "tag": "CBSE 2023", "question": "Explain the geographical conditions required for the cultivation of 'Rice' in India. Name two leading producer states. [3 Marks]", "answer": "Conditions: Warm humid climate, 20\u00b0C\u201330\u00b0C temperature, 100+ cm rainfall, fertile alluvial clay soil; Leading states: West Bengal, Uttar Pradesh.", "explanation": "Marking Scheme (2 Marks geographical conditions + 1 Mark leading producer states):\n\u2022 Geographical Conditions:\n  - Temperature: Warm, humid conditions with mean temperatures between 20\u00b0C and 30\u00b0C.\n  - Rainfall: 100 cm to 200 cm of annual rainfall, or equivalent canal and tubewell irrigation during early growth.\n  - Soil: Deep, moisture-retentive alluvial clay loam capable of holding standing water.\n\u2022 Leading States: West Bengal and Uttar Pradesh lead national production, with Punjab and Haryana achieving high yields under irrigation."}, {"id": 35, "type": "SA", "tag": "CBSE 2022", "question": "What were the core achievements and ecological drawbacks of the 'Green Revolution' in India? [3 Marks]", "answer": "Achievements: Food self-sufficiency, wheat/rice yield jumps; Drawbacks: Soil salinization, water table depletion, regional disparities.", "explanation": "Marking Scheme (1.5 Marks achievements + 1.5 Marks ecological drawbacks):\n\u2022 Key Achievements:\n  - Achieved national food self-sufficiency in wheat and rice, ending dependence on foreign food aid (PL-480).\n  - Encouraged agricultural mechanization and spurred rural commercial trade.\n\u2022 Ecological Drawbacks:\n  - Intensive tubewell irrigation depleted groundwater tables in Punjab and Haryana.\n  - Over-application of chemical fertilizers and canal irrigation caused soil salinization and waterlogging in command areas."}, {"id": 36, "type": "SA", "tag": "CBSE 2022", "question": "Describe the distribution and growth conditions required for 'Cotton' cultivation in India. [3 Marks]", "answer": "Conditions: Tropical/subtropical, 21\u00b0C\u201330\u00b0C, 210 frost-free days, black basalt soil (Regur); Distribution: Gujarat, Maharashtra, Telangana.", "explanation": "Marking Scheme (1.5 Marks environmental conditions + 1.5 Marks spatial distribution):\n\u2022 Growth Conditions:\n  - Requires warm tropical/subtropical temperatures (21\u00b0C\u201330\u00b0C) and at least 210 frost-free days with bright sunshine.\n  - Grows well on moisture-retentive black lava soils (Regur) of the Deccan Plateau.\n\u2022 Spatial Distribution:\n  - Leading producers include Gujarat, Maharashtra, and Telangana, with long-staple varieties grown under irrigation in Punjab and Haryana."}, {"id": 37, "type": "SA", "tag": "CBSE 2020", "question": "Explain the significance of 'Pulses' in the Indian agricultural economy and diet. Name two major pulse crops. [3 Marks]", "answer": "Key protein source for vegetarian diet; fixes nitrogen to restore soil fertility; major pulses: Gram (chana) and Tur (arhar).", "explanation": "Marking Scheme (1 Mark dietary role + 1 Mark soil health + 1 Mark examples):\n\u2022 Dietary Value: Provides an essential source of vegetable protein in the predominantly vegetarian Indian diet.\n\u2022 Ecological Value: Leguminous root nodules harbor bacteria that fix atmospheric nitrogen, restoring soil fertility during crop rotations.\n\u2022 Major Crops: Gram (chana), grown as a winter Rabi crop, and Tur (arhar/pigeon pea), grown as a Kharif crop."}, {"id": 38, "type": "SA", "tag": "CBSE 2019", "question": "What are the geographical conditions favorable for 'Tea' cultivation? Name the leading tea-producing state. [3 Marks]", "answer": "Conditions: Warm humid climate (20\u00b0C\u201330\u00b0C), 150\u2013250 cm rainfall, well-drained acidic hill slopes, shade trees; Leading state: Assam.", "explanation": "Marking Scheme (2 Marks conditions + 1 Mark leading state):\n\u2022 Favorable Conditions:\n  - Thrives in warm, humid subtropical climates with annual rainfall between 150 and 250 cm, with frequent showers supporting tender leaf flushes.\n  - Requires deep, friable, acidic loam on well-drained hill slopes to prevent standing water from damaging root systems.\n\u2022 Leading State: Assam produces over half of India's tea, concentrated in the Brahmaputra Valley, followed by West Bengal (Darjeeling/Dooars)."}, {"id": 39, "type": "SA", "tag": "CBSE 2018", "question": "State any three major problems faced by Indian agriculture. [3 Marks]", "answer": "1. Small and fragmented land holdings; 2. Over-dependence on erratic monsoons; 3. Soil degradation and low crop productivity.", "explanation": "Marking Scheme (1 Mark for each agricultural problem):\n\u2022 1. Small Landholdings: Generational inheritance divides farms into small, fragmented plots (averaging <1.1 ha), limiting modern mechanization.\n\u2022 2. Monsoon Dependency: Large rainfed tracts remain vulnerable to droughts or erratic monsoon timing.\n\u2022 3. Soil Degradation: Decades of intensive cultivation without balanced organic replenishment have caused soil salinization, nutrient loss, and lower yield growth."}, {"id": 40, "type": "SA", "tag": "CBSE 2017", "question": "Differentiate between 'Culturable Wasteland' and 'Barren and Wasteland'. [3 Marks]", "answer": "Culturable Wasteland: Fallow for >5 years, reclaimable for farming; Barren: Cannot be cultivated except at prohibitive cost (rocky hills, sand dunes).", "explanation": "Marking Scheme (1.5 Marks Culturable Wasteland + 1.5 Marks Barren and Wasteland):\n\u2022 Culturable Wasteland:\n  - Land that has remained uncultivated for more than five consecutive years.\n  - Can be rehabilitated for agricultural use through land reclamation, soil leveling, and irrigation investment.\n\u2022 Barren and Wasteland:\n  - Land that cannot be brought under cultivation except at prohibitive expense (e.g. bare rock faces, desert sand dunes, gullied ravines)."}, {"id": 41, "type": "LA", "tag": "CBSE 2024", "question": "Examine the classification of 'Land Use Categories' maintained by the Land Revenue Department in India. Discuss how changes in the size and composition of the Indian economy have altered land use patterns over the past half-century. [5 Marks]", "answer": "Detailed examination: Nine land use categories; Economic drivers: (1) Increasing size of economy expanding built-up land; (2) Secondary and tertiary growth shifting land to non-agricultural uses; (3) Declining agricultural land share; Shifts in forest area, net sown area, and fallow land.", "explanation": "Step-by-Step Marking Scheme (2 Marks nine land use categories + 2 Marks economic drivers of land use changes + 1 Mark structural shifts in agricultural land):\n\u2022 1. Land Use Categories (Land Revenue Records) [2 Marks]:\n  - Categorized into nine classes: Forests, Non-Agricultural Uses, Barren & Wasteland, Permanent Pastures, Tree Crops & Groves, Culturable Wasteland, Current Fallow, Other Fallow, and Net Sown Area.\n\u2022 2. Economic Drivers of Land Use Change [2 Marks]:\n  - Economic Scale: Population and GDP growth increase demand for land for housing, transport corridors, and industrial sites.\n  - Sectoral Shifts: Expansion of manufacturing and services converts agricultural land on urban peripheries to non-agricultural uses.\n\u2022 3. Structural Shifts in Land Use [1 Mark]:\n  - Net Sown Area has largely stabilized, while land put to non-agricultural uses has increased; current fallow fluctuates based on annual monsoon rainfall."}, {"id": 42, "type": "LA", "tag": "CBSE 2024", "question": "Critically analyze the 'Green Revolution' in India. Discuss its historical background, technological package, socio-economic successes in achieving food self-sufficiency, and emergent ecological crises. [5 Marks]", "answer": "Comprehensive analysis: Background (Severe food deficits, 1960s droughts, PL-480 dependency); Technology package (HYV Mexican wheat & IR-8 rice, fertilizers, irrigation, mechanization); Successes (Punjab/Haryana yield boom, national food security); Ecological crises (Depleted water table, salinization, chemical runoff, regional disparity).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks background & technology package + 1.75 Marks food self-sufficiency achievements + 1.75 Marks ecological crises):\n\u2022 1. Background & Technological Package [1.5 Marks]:\n  - Introduced in the mid-1960s to address chronic food shortages, droughts, and reliance on foreign food imports.\n  - Centered on dwarf High Yielding Varieties (HYVs) of wheat and rice developed by Norman Borlaug and adapted by Indian scientists under M.S. Swaminathan, paired with chemical fertilizers, pesticides, and assured irrigation.\n\u2022 2. Food Self-Sufficiency Achievements [1.75 Marks]:\n  - Generated substantial yield gains in Punjab, Haryana, and Western Uttar Pradesh, turning India from a food-deficit nation into an exporter.\n  - Built national food grain buffer stocks managed by the Food Corporation of India (FCI).\n\u2022 3. Emergent Ecological Crises [1.75 Marks]:\n  - Heavy tubewell pumping caused steep groundwater table declines across northwestern states.\n  - Over-application of chemical fertilizers degraded soil microflora, while excess canal irrigation led to waterlogging and soil salinization."}, {"id": 43, "type": "LA", "tag": "CBSE 2023", "question": "Examine the geographic distribution, climatic requirements, soil preferences, and major producing states of 'Wheat' in India. Contrast wheat cultivation with rice cultivation in terms of seasons and inputs. [5 Marks]", "answer": "Detailed examination: Wheat as premier Rabi crop; Cool growing season (10-15\u00b0C), bright ripening sun; Well-drained loams; Leading states: UP, Punjab, Haryana, MP; Contrast with Rice (Tropical Kharif vs Temperate Rabi; Standing water vs moderate moisture; Manual labor vs Mechanized combine harvesting).", "explanation": "Step-by-Step Marking Scheme (2.5 Marks Wheat cultivation profile + 2.5 Marks Contrast with Rice):\n\u2022 1. Wheat Cultivation Profile [2.5 Marks]:\n  - Climatic Requirements: Cool vegetative growth (10\u00b0C\u201315\u00b0C) and warm, dry sunshine (20\u00b0C\u201325\u00b0C) during grain filling and harvest, with 50\u201375 cm of moisture.\n  - Soil Preferences: Deep, well-drained alluvial loams and clay loams of the Indo-Gangetic Plains and black soils of central India.\n  - Leading States: Uttar Pradesh leads in total production, while Punjab and Haryana record the highest yields (>4,000 kg/ha).\n\u2022 2. Contrast with Rice [2.5 Marks]:\n  - Seasonality: Wheat is a winter Rabi crop; rice is predominantly a monsoon Kharif crop.\n  - Water & Inputs: Rice requires standing water and intensive manual labor; wheat requires periodic irrigation at crown-root initiation and relies heavily on tractor-drawn seed drills and combine harvesters."}, {"id": 44, "type": "LA", "tag": "CBSE 2023", "question": "Discuss the major 'Problems of Indian Agriculture'. Examine small holding fragmentation, monsoon dependency, low productivity, and credit indebtedness. Suggest institutional and technological remedies. [5 Marks]", "answer": "Comprehensive examination of problems: (1) Fragmented landholdings (<1.1 ha); (2) Erratic monsoon dependency; (3) Low crop yields vs world averages; (4) Farmer indebtedness and credit gaps; (5) Degradation of arable soil; Remedial measures (Land consolidation, micro-irrigation, Kisan Credit Cards, crop insurance).", "explanation": "Step-by-Step Marking Scheme (3 Marks detailed problems + 2 Marks institutional and technological remedies):\n\u2022 1. Major Structural Problems [3 Marks]:\n  - Land Fragmentation: Generational inheritance divides holdings below 1.1 hectares, making mechanization difficult.\n  - Monsoon Vulnerability: Over half of cultivated land remains rainfed, leaving crops exposed to droughts or delayed rains.\n  - Low Productivity: Average yields for rice, wheat, and pulses lag behind global averages in China and the US.\n  - Credit & Indebtedness: Inadequate formal rural credit leaves smallholders reliant on informal lenders, contributing to rural debt distress.\n\u2022 2. Institutional & Technological Remedies [2 Marks]:\n  - Land consolidation schemes and support for Farmer Producer Organizations (FPOs) to achieve economies of scale.\n  - Expanding micro-irrigation (drip/sprinkler systems) under the Pradhan Mantri Krishi Sinchayee Yojana, combined with institutional credit via Kisan Credit Cards (KCC) and PM-Fasal Bima Yojana."}, {"id": 45, "type": "LA", "tag": "CBSE 2022", "question": "Examine the geographic distribution and growth conditions of major 'Cash Crops' in India: (a) Sugarcane, (b) Cotton, and (c) Tea. Detail their economic importance and leading producing states. [5 Marks]", "answer": "Detailed examination: (1) Sugarcane (Tropical/subtropical, deep fertile loams, high irrigation, UP, Maharashtra); (2) Cotton (Black regur soil, 210 frost-free days, Gujarat, Maharashtra, Telangana); (3) Tea (Acidic well-drained slopes, warm humid climate, Assam, West Bengal); Economic importance.", "explanation": "Step-by-Step Marking Scheme (1.5 Marks Sugarcane + 1.5 Marks Cotton + 1.5 Marks Tea + 0.5 Mark economic significance):\n\u2022 1. Sugarcane [1.5 Marks]:\n  - Tropical/subtropical crop requiring 21\u00b0C\u201327\u00b0C and 75\u2013100 cm rainfall; grown on deep alluvial and black soils.\n  - Leading producers: Uttar Pradesh and Maharashtra; provides raw material for the sugar and bio-ethanol industries.\n\u2022 2. Cotton [1.5 Marks]:\n  - Requires warm conditions (21\u00b0C\u201330\u00b0C), at least 210 frost-free days, and black basaltic soils (Regur).\n  - Leading producers: Gujarat, Maharashtra, and Telangana; supplies the domestic textile and apparel export industry.\n\u2022 3. Tea [1.5 Marks]:\n  - Grown on well-drained, acidic hill slopes in warm, humid climates with 150\u2013250 cm rainfall.\n  - Leading producers: Assam (Brahmaputra Valley) and West Bengal (Darjeeling); major foreign exchange earner.\n\u2022 4. Economic Significance [0.5 Mark]:\n  - These cash crops supply raw materials for domestic agro-processing industries and generate export revenues."}, {"id": 46, "type": "LA", "tag": "CBSE 2021", "question": "Analyze the spatial distribution, cultivation requirements, and varieties of 'Coffee' and 'Jute' in India. Explain why jute cultivation is concentrated in the eastern deltaic belt. [5 Marks]", "answer": "Analysis: Coffee (Arabica and Robusta, shade trees, well-drained laterite/loam, Karnataka >70%, Kerala, Tamil Nadu); Jute ('Golden fibre', warm humid climate, alluvial silt renewed annually by floods, West Bengal leading); Concentration of jute in eastern delta (water for retting, cheap labor, Kolkata port).", "explanation": "Step-by-Step Marking Scheme (2.5 Marks Coffee cultivation profile + 2.5 Marks Jute cultivation & eastern concentration):\n\u2022 1. Coffee Cultivation in India [2.5 Marks]:\n  - Conditions: Requires warm, humid climates (15\u00b0C\u201328\u00b0C), 150\u2013200 cm rainfall, and well-drained forest loam on sloped highlands.\n  - Varieties & Distribution: Cultivates both Arabica and Robusta varieties, with Karnataka accounting for over 70% of output (Kodagu, Chikkamagaluru), followed by Kerala and Tamil Nadu.\n\u2022 2. Jute Cultivation & Eastern Concentration [2.5 Marks]:\n  - Conditions: Requires high temperatures (25\u00b0C\u201335\u00b0C), heavy rainfall (>150 cm), and deep alluvial silt renewed by seasonal floods.\n  - Concentration Factors: Centered in the Ganga-Brahmaputra delta (West Bengal, Bihar, Assam) due to fertile soils, abundant clean water for stem retting, cheap labor, and proximity to Kolkata's export port."}, {"id": 47, "type": "LA", "tag": "CBSE 2020", "question": "Discuss the 'Agricultural Development Strategies' implemented in post-independence India. Compare the early community development approaches with the Intensive Agricultural District Programme (IADP) and the modern National Mission for Sustainable Agriculture. [5 Marks]", "answer": "Policy evolution: (1) Post-1947 focus on land reforms and major irrigation dams (Bhakra Nangal, Hirakud); (2) 1960s package approach: IADP and IAAP targeting favorable districts; (3) Green Revolution technology diffusion; (4) Modern shift to sustainable agriculture (micro-irrigation, soil health cards, organic farming).", "explanation": "Step-by-Step Marking Scheme (1.5 Marks early post-independence dams & land reforms + 1.75 Marks IADP & Green Revolution + 1.75 Marks sustainable agriculture missions):\n\u2022 1. Early Post-Independence Strategies (1950s) [1.5 Marks]:\n  - Focused on institutional land reforms (abolishing zamindari, tenancy protection) and multi-purpose river valley projects (Bhakra-Nangal, Damodar Valley, Hirakud).\n\u2022 2. The Target Area Approach: IADP & IAAP (1960s) [1.75 Marks]:\n  - Shifted from spreading resources thinly to concentrating high-yield inputs in districts with assured irrigation (IADP/IAAP), paving the way for the Green Revolution.\n\u2022 3. The Shift to Sustainable Agriculture (21st Century) [1.75 Marks]:\n  - Addresses environmental impacts of chemical-intensive farming through the National Mission for Sustainable Agriculture (NMSA).\n  - Promotes micro-irrigation, Soil Health Cards, organic farming (Paramparagat Krishi Vikas Yojana), and integrated pest management."}, {"id": 48, "type": "LA", "tag": "CBSE 2019", "question": "Examine the role of 'Coarse Cereals' (Jowar, Bajra, Maize) and 'Pulses' in sustaining food security and dryland agriculture in India. [5 Marks]", "answer": "Examination: Coarse cereals / Millets (Nutri-cereals, climate resilient, low water footprint, jowar in Maharashtra, bajra in Rajasthan, maize in Karnataka); Pulses (Protein security, nitrogen fixation, gram and tur); Drought resistance and nutritional value.", "explanation": "Step-by-Step Marking Scheme (2.5 Marks Coarse Cereals/Millets + 2.5 Marks Pulses):\n\u2022 1. Coarse Cereals (Nutri-Cereals) [2.5 Marks]:\n  - Crops: Jowar, Bajra, and Maize; account for over 16% of total cropped area.\n  - Climate Resilience: Adapted to semi-arid climates with low rainfall and poorer soils where wheat or rice cannot thrive.\n  - Nutritional Value: Rich in dietary fiber, iron, calcium, and micronutrients, supporting rural nutritional security.\n\u2022 2. Pulses in Dryland Security [2.5 Marks]:\n  - Crops: Gram, Tur, Urad, and Moong; primary protein source for vegetarian diets.\n  - Soil Health: Leguminous root nodules fix atmospheric nitrogen, restoring soil fertility and reducing the need for chemical fertilizers in dryland farming systems."}, {"id": 49, "type": "LA", "tag": "CBSE 2018", "question": "\"Degradation of cultivable land is one of the most serious challenges confronting Indian agriculture.\" Evaluate this statement by examining soil erosion, waterlogging, salinization, and pesticide toxicity across different agro-climatic regions. [5 Marks]", "answer": "Evaluation: Land degradation dimensions; (1) Water and wind erosion (Deforestation, ravines in Chambal, sand shifting in Rajasthan); (2) Salinization and waterlogging (Indira Gandhi Canal command, Punjab/Haryana canal tracts); (3) Chemical toxicity and micro-nutrient depletion; Policy solutions.", "explanation": "Step-by-Step Marking Scheme (1.5 Marks erosion mechanisms + 1.75 Marks salinization & waterlogging + 1.75 Marks chemical toxicity & reclamation):\n\u2022 1. Soil Erosion by Water and Wind [1.5 Marks]:\n  - Deforestation and unscientific plowing cause topsoil loss in the Siwaliks and Chota Nagpur, while wind erosion creates shifting dunes in western Rajasthan.\n  - Gullied ravines along the Chambal and Yamuna basins take arable land out of production.\n\u2022 2. Waterlogging and Salinization [1.75 Marks]:\n  - In canal-irrigated command areas (e.g. Indira Gandhi Canal, Punjab, Haryana), over-watering without drainage raises the water table.\n  - Evaporation leaves mineral salts on the surface, creating barren saline soils (usar/reh).\n\u2022 3. Chemical Depletion & Land Reclamation [1.75 Marks]:\n  - Decades of intensive cropping without organic inputs have depleted soil micronutrients.\n  - Remedies include gypsum application on saline soils, subsurface drainage, afforestation, and bio-fertilizers."}, {"id": 50, "type": "LA", "tag": "CBSE 2017", "question": "Assess the impact of 'Globalization' and trade liberalization on Indian agriculture since 1991. What opportunities and structural risks have emerged for Indian farmers in the global marketplace? [5 Marks]", "answer": "Assessment: Post-1991 economic reforms; Opportunities (Export of basmati rice, spices, organic fruits/vegetables, contract farming, agro-processing); Structural risks (Exposure to fluctuating global prices, competition with subsidized foreign farm imports, input cost inflation, patenting of seeds).", "explanation": "Step-by-Step Marking Scheme (2.5 Marks opportunities of globalization + 2.5 Marks structural risks and vulnerabilities):\n\u2022 1. Opportunities Created by Globalization [2.5 Marks]:\n  - Opened export markets for high-value agricultural products, including Basmati rice, spices, marine goods, and fresh fruits.\n  - Encouraged private investment in food processing, cold-chain logistics, and contract farming, connecting farmers to urban retail chains.\n\u2022 2. Structural Risks & Vulnerabilities [2.5 Marks]:\n  - Exposed smallholders to volatile international commodity price swings without guaranteed price support.\n  - Competition from heavily subsidized agricultural imports from developed economies can depress domestic farm-gate prices.\n  - Rising costs for commercial hybrid seeds and agrochemicals have contributed to rural debt distress in cotton-growing regions."}]}, {"info": {"chapter_num": 12, "book": "India: People and Economy", "title": "Water Resources", "author": "NCERT Class 12 Geography (029)", "weightage_unit": "Book 2 - Unit III: Resources & Development - Water Resources (5 Marks)"}, "questions": [{"id": 1, "type": "MCQ", "tag": "CBSE 2024", "question": "Which sector accounts for the HIGHEST proportion of both surface water (89%) and groundwater (92%) utilization in India?", "options": ["(a) Agricultural sector", "(b) Domestic municipal sector", "(c) Heavy industrial sector", "(d) Thermal power generation"], "answer": "(a) Agricultural sector", "explanation": "Agriculture is the largest consumer of water in India, utilizing 89% of surface water and 92% of replenishable groundwater for irrigation."}, {"id": 2, "type": "MCQ", "tag": "CBSE 2024", "question": "Which was the FIRST state in India to make rooftop rainwater harvesting compulsory for all houses, imposing legal penalties for non-compliance?", "options": ["(a) Tamil Nadu", "(b) Rajasthan", "(c) Maharashtra", "(d) Gujarat"], "answer": "(a) Tamil Nadu", "explanation": "Tamil Nadu made rooftop rainwater harvesting structures legally mandatory for all buildings in 2001, penalizing non-compliance."}, {"id": 3, "type": "MCQ", "tag": "CBSE 2023", "question": "The famous community-led watershed management program 'Arvary Pani Sansad', which revitalized dried-up streams using traditional Johads, was implemented in which district of Rajasthan?", "options": ["(a) Alwar", "(b) Jaisalmer", "(c) Bikaner", "(d) Jodhpur"], "answer": "(a) Alwar", "explanation": "The Arvary Pani Sansad program in Alwar, Rajasthan, mobilized community action to construct traditional earthen check dams (johads), reviving local streams."}, {"id": 4, "type": "MCQ", "tag": "CBSE 2023", "question": "The watershed development project sponsored by the Central Government that aims at enabling rural populations to conserve water for drinking, irrigation, and afforestation through Gram Panchayats is called:", "options": ["(a) Haryali", "(b) Neeru-Meeru", "(c) Arvary Sansad", "(d) Jal Shakti"], "answer": "(a) Haryali", "explanation": "Haryali is a central government-sponsored watershed project executed by Gram Panchayats to conserve water for drinking, irrigation, and fisheries."}, {"id": 5, "type": "MCQ", "tag": "CBSE 2022 Term-1", "question": "Which of the following states in India exhibit exceptionally high levels of groundwater utilization (over 85 to 100%), leading to critical depletion of aquifers?", "options": ["(a) Punjab, Haryana, Rajasthan, and Tamil Nadu", "(b) Chhattisgarh and Odisha", "(c) Assam and Meghalaya", "(d) Kerala and Goa"], "answer": "(a) Punjab, Haryana, Rajasthan, and Tamil Nadu", "explanation": "Punjab, Haryana, Rajasthan, and Tamil Nadu have over-exploited groundwater reserves for agriculture, resulting in steep water table declines."}, {"id": 6, "type": "MCQ", "tag": "CBSE 2022 Term-1", "question": "Th
